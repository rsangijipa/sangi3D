<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191510">
    <meta name="description" content="Monte um vitral e observe a luz atravessar o vidro.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cpath fill='%23291c13' stroke='%23e0b988' d='M18 1 35 18 18 35 1 18Z'/%3E%3Cpath fill='%23e1a353' d='m18 5 6 6-6 6-6-6Z'/%3E%3Cpath fill='%236f9990' d='m25 12 6 6-6 6-6-6Z'/%3E%3Cpath fill='%23668baa' d='m11 12 6 6-6 6-6-6Z'/%3E%3Cpath fill='%23c47972' d='m18 19 6 6-6 6-6-6Z'/%3E%3C/svg%3E">
    <title>Oficina do Vitralista</title>
    <script type="module" crossorigin src="./assets/index-C5x3oi0h.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-core-C5FkYRX2.js">
    <link rel="modulepreload" crossorigin href="./assets/three-renderer-r-FRlDtg.js">
    <link rel="stylesheet" crossorigin href="./assets/index-B9Wh_ryJ.css">
  </head>
  <body>
    <main id="workshop">
      <div id="scene" aria-label="Bancada de vitral em 3D"></div>
      <div class="shade" aria-hidden="true"></div>
      <header class="top chrome">
        <div class="identity">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <h1>Oficina do Vitralista</h1>
        </div>
        <div class="top-controls">
          <label class="selector"><span>Molde</span><select id="mold" aria-label="Molde"><option value="roseta">Rosácea</option><option value="botanico">Botânico</option><option value="geometrico">Geométrico</option></select></label>
          <label class="selector"><span>Luz</span><select id="light" aria-label="Luz"><option value="morning">Manhã dourada</option><option value="noon">Meio-dia claro</option><option value="dusk">Entardecer âmbar</option></select></label>
          <button id="settings-button" aria-controls="settings" aria-expanded="false">Ajustes</button>
          <button class="icon-button" id="fullscreen" aria-label="Tela cheia" title="Tela cheia">⛶</button>
          <button class="icon-button" id="hide" aria-label="Recolher interface" title="Recolher interface (H)">‹</button>
        </div>
      </header>
      <aside class="settings" id="settings" hidden aria-label="Ajustes">
        <label>Qualidade <select id="quality"><option value="alta">Cinema</option><option value="media">Equilibrada</option><option value="baixa">Leve</option></select></label>
        <label><span>Som</span><input id="sound" type="checkbox" checked></label>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.55"></label>
        <p><kbd>1</kbd>–<kbd>5</kbd> Vidros · <kbd>E</kbd> Encaixar · <kbd>S</kbd> Soldar · <kbd>C</kbd> Cor · <kbd>V</kbd> Inspecionar · <kbd>H</kbd> Interface</p>
      </aside>
      <p id="loading" role="status">Preparando a bancada…</p>
      <button id="show" class="icon-button" aria-label="Mostrar interface" title="Mostrar interface (H)" hidden>›</button>
      <div class="lower chrome">
        <div class="guidance">
          <p id="instruction" aria-live="polite">Escolha um vidro e toque em um vão do molde.</p>
          <button id="access" aria-controls="targets" aria-expanded="false">Ações do molde</button>
        </div>
        <section id="targets" hidden aria-label="Ações do molde">
          <label for="target" id="target-label">Vão</label>
          <select id="target"></select>
          <button id="apply">Encaixar vidro</button>
        </section>
        <footer class="bench-controls">
          <div class="palette" id="palette" aria-label="Vidros"></div>
          <div class="tools" aria-label="Ferramentas">
            <button data-tool="place" aria-pressed="true"><span aria-hidden="true">◇</span> Encaixar</button>
            <button data-tool="solder" aria-pressed="false"><span aria-hidden="true">╱</span> Soldar</button>
            <button data-tool="color" aria-pressed="false"><span aria-hidden="true">◈</span> Trocar cor</button>
          </div>
          <div class="views">
            <button id="inspect" aria-pressed="false">Contra a luz</button>
            <button id="export">Exportar PNG <span aria-hidden="true">↓</span></button>
          </div>
        </footer>
      </div>
    </main>
  </body>
</html>
