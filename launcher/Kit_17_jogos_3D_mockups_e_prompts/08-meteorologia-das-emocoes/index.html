<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="description" content="Meteorologia das Emoções — componha um clima simbólico para suas experiências emocionais." />
  <title>Meteorologia das Emoções</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" />
</head>
<body>
  <div id="app">
    <canvas id="glcanvas" tabindex="-1" aria-hidden="true"></canvas>
    <div id="hud" class="hud" role="region" aria-label="Painel de composição do clima"></div>
    <div id="overlays"></div>
    <div id="loader" class="loader" role="status" aria-label="Carregando">
      <span class="loader-text">Carregando observatório…</span>
    </div>
    <div id="a11y-hint" class="sr-only" aria-live="polite"></div>
  </div>
  <script src="../../../shared/sangi-bridge.js" defer></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
