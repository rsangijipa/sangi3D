<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Iframe Session Test Harness</title>
  <script>
    window.received = [];
    window.addEventListener('message', function(e) {
      if (e.data) {
        window.received.push(e.data);
      }
    });
  </script>
</head>
<body>
  <iframe id="game-frame" src="./index.html" width="800" height="600"></iframe>
</body>
</html>
