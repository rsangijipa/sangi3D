<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Torre do Impulso — Sangi3D</title>
  <style>
    :root {
      --bg: #141816;
      --card-bg: rgba(22, 28, 25, 0.92);
      --card-border: rgba(180, 210, 190, 0.28);
      --text: #F2E4CC;
      --text-muted: #96A39C;
      --accent-green: #3B6E52;
      --accent-amber: #D8AE66;
      --accent-blue: #4A7A8C;
      --serif: "Georgia", "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--sans);
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .hud-panel {
      position: absolute; top: 16px; right: 16px; width: 330px; max-height: calc(100dvh - 32px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
      z-index: 10;
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px;
      overflow-y: auto;
    }
    .hud-header h1 {
      font-family: var(--serif); font-size: 20px; font-weight: 600; color: #FAF5E9; margin-bottom: 4px;
    }
    .hud-header p {
      font-size: 12px; color: var(--text-muted); line-height: 1.4;
    }

    .signal-card {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: rgba(0,0,0,0.4); padding: 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .signal-icon {
      width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px currentColor;
    }
    .signal-icon.amber {
      background: #D8AE66; color: #D8AE66; border-radius: 4px; transform: rotate(45deg);
    }
    .signal-icon.blue {
      background: #4A7A8C; color: #4A7A8C; border-radius: 50%;
    }
    .signal-text {
      font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    }

    .btn-action {
      width: 100%; padding: 14px; font-size: 14px; font-weight: 600;
      background: var(--accent-green); color: #FFF; border: none; border-radius: 10px;
      cursor: pointer; text-align: center; box-shadow: 0 6px 16px rgba(59,110,82,0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-action:disabled {
      background: rgba(255,255,255,0.1); color: var(--text-muted); cursor: not-allowed; box-shadow: none;
    }

    .status-summary {
      background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px; font-size: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .summary-row { display: flex; justify-content: space-between; }
    .summary-val { font-weight: 600; color: var(--accent-amber); }

    .help-msg {
      font-size: 11px; color: var(--text-muted); font-style: italic; text-align: center;
    }


    .hud-panel { --text: #33271b; --text-muted: #5e4c39; background: #f2e4cd; border-color: #d7bd97; color: var(--text); }
    .hud-header { margin: -20px -20px 0; padding: 20px; background: #294834; }
    .hud-header p { color: #efdfc5; }
    .signal-card, .status-summary { background: #ead9bd; color: #3e2e23; }
    .summary-val { color: #68472d; }
    .btn-pause { background: #f5ebd9; border: 1px solid #a28b68; color: #304e38; }
    .btn-pause:hover { background: #fffaed; }
    .hud-panel button:focus-visible { outline: 2px solid #825227; outline-offset: 2px; }
    @media (max-width: 768px) and (orientation: portrait) {
      #canvas-container { height: 57dvh; }
      .hud-header { margin: -16px -18px 0; padding: 14px 18px; }
      .hud-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 43dvh;
        border-radius: 20px 20px 0 0; padding: 16px 18px 24px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/shared/vendor/three.module.js",
      "three/addons/": "/shared/vendor/addons/"
    }
  }
  </script>
  <script src="/shared/sangi-bridge.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-panel" id="hud">
    <div class="hud-header">
      <h1>Torre do Impulso</h1>
      <p>Observe o sinal luminoso e solte a esfera de latão pela pista helicoidal.</p>
    </div>

    <div class="signal-card" id="signal-card" aria-live="polite">
      <div class="signal-icon blue" id="signal-icon"></div>
      <div class="signal-text" id="signal-text">AGUARDAR</div>
    </div>

    <button class="btn-action" id="btn-release" onclick="attemptRelease()">Liberar Esfera (Espaço)</button>

    <button class="btn-action btn-pause" id="btn-pause" aria-pressed="false" onclick="togglePause()">Pausar</button>

    <div class="status-summary">
      <div class="summary-row">
        <span>Rodada:</span>
        <span class="summary-val" id="lbl-round">1 / 5</span>
      </div>
      <div class="summary-row">
        <span>Esferas Liberadas:</span>
        <span class="summary-val" id="lbl-released">0</span>
      </div>
      <div class="summary-row">
        <span>Aguardadas com Calma:</span>
        <span class="summary-val" id="lbl-waited">0</span>
      </div>
      <div class="summary-row">
        <span>Toques Antecipados:</span>
        <span class="summary-val" id="lbl-early">0</span>
      </div>
    </div>

    <div class="help-msg" id="help-msg">Aguarde o sinal losango dourado aparecer para liberar.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    window.THREE = window.THREE || THREE;

    import { injectLauncherButton } from '/shared/ambientes-kit.js';
    import { EngineRenderer } from '/shared/engine/renderer.js';
    import { MaterialFactory } from '/shared/engine/materials.js';
    import { LightingRig } from '/shared/engine/lighting.js';
    import { ResponsiveAudio } from '/shared/engine/audio.js';
    import { LifecycleManager } from '/shared/engine/lifecycle.js';
    import { beam, mesh, profile, roundedBox } from '/shared/engine/scene-details.js';
    import { buildWorkshop } from '/shared/engine/workshop.js';

    injectLauncherButton({ label: '← Launcher', href: '/' });

    const container = document.getElementById('canvas-container');
    const audio = new ResponsiveAudio();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x131a16);
    scene.fog = new THREE.FogExp2(0x131a16, 0.04);

    const camera = new THREE.PerspectiveCamera(39, 1, .1, 40);
    const engineRenderer = new EngineRenderer(null, {
      shadowMap: true, toneMappingExposure: 1.09, environmentIntensity: .76,
      maxPixelRatio: Math.min(devicePixelRatio || 1, 1.5)
    });
    container.appendChild(engineRenderer.canvas);
    function frameScene() {
      const { clientWidth: width, clientHeight: height } = container;
      camera.aspect = width / height;
      if (matchMedia('(max-width: 768px) and (orientation: portrait)').matches) {
        camera.position.set(.16, 2.56, 6.78);
        camera.lookAt(-.14, 1.70, 0);
      } else {
        camera.position.set(.23, 2.76, 6.47);
        camera.lookAt(.95, 1.65, -.12);
      }
      camera.updateProjectionMatrix();
      engineRenderer.renderer.setSize(width, height, false);
    }
    frameScene();
    window.addEventListener('resize', frameScene);

    const lighting = new LightingRig(scene, { ambientIntensity: .67, mainIntensity: 1.96 });
    lighting.mainLight.color.setHex(0xffe1b7);
    lighting.mainLight.position.set(-4.4, 5.7, 4.4);
    lighting.mainLight.shadow.normalBias = .02;

    const room = new THREE.Group();
    room.position.y = -1.06;
    scene.add(room);
    const { oak, trim, brass } = buildWorkshop(room);

    // Estado da FSM
    window.game = {
      fsm: 'awaiting', // 'awaiting', 'ready', 'rolling', 'caught'
      round: 1,
      released: 0,
      waited: 0,
      early: 0,
      progress: 0, // 0 a 1 na spline da espiral
      speed: 0,
      remaining: 0,
      paused: false
    };

    // Montagem da Torre Mecânica 3D
    const tower = new THREE.Group();
    scene.add(tower);

    const rugMaterial = MaterialFactory.wood(0x747450, .97);
    rugMaterial.map.repeat.set(4, 5);
    rugMaterial.bumpScale = .021;
    mesh(tower, new THREE.CylinderGeometry(1.76, 1.77, .025, 64), rugMaterial, -.10, .012, .01, false);
    const baseShape = profile([[0, .027], [1.15, .027], [1.22, .063], [1.22, .144], [1.17, .17], [0, .17]], 72);
    mesh(tower, baseShape, oak, 0, 0, 0);
    const steel = MaterialFactory.metal(0xb3aaa0, .25, .89);
    mesh(tower, new THREE.CylinderGeometry(.044, .048, 3.05, 28), steel, .04, 1.69, -.16);
    mesh(tower, roundedBox(.27, 2.91, .38, .044), oak, -.99, 1.61, -.24);
    mesh(tower, roundedBox(.43, .12, .54, .043), trim, -.99, .21, -.24);
    for (const y of [.30, 1.08, 1.83, 2.57, 3.12]) {
      mesh(tower, new THREE.CylinderGeometry(.078, .078, .052, 24), brass, .04, y, -.16);
    }
    for (const y of [1.008, 1.751, 2.494]) {
      beam(tower, [-.88, y, -.24], [.04, y, -.16], .052, .073, steel);
    }

    const bowlGlass = new THREE.MeshPhysicalMaterial({
      color: 0xf4faff, transmission: .98, thickness: .04, roughness: .075, ior: 1.47
    });
    const bowl = profile([[.085, 0], [.19, .035], [.28, .10], [.36, .20], [.398, .30],
      [.405, .315], [.389, .321], [.375, .29], [.337, .207], [.255, .116],
      [.177, .068], [.078, .036]], 58);
    mesh(tower, bowl, bowlGlass, .65, 3.15, 0, false);
    const collar = new THREE.TorusGeometry(.116, .018, 8, 34);
    const bowlSupport = mesh(tower, collar, steel, .65, 3.158, 0);
    bowlSupport.rotation.x = Math.PI / 2;
    beam(tower, [.04, 3.13, -.16], [.65, 3.13, 0], .058, .083, steel);
    const brace = mesh(tower, new THREE.CylinderGeometry(.038, .038, .21, 16), steel, .65, 3.10, 0);
    brace.castShadow = true;
    mesh(tower, roundedBox(.53, .075, .19, .028), oak, .46, 3.08, .003);
    const gate = new THREE.Group();
    gate.position.set(.50, 3.12, .008);
    tower.add(gate);
    mesh(gate, roundedBox(.23, .048, .22, .019), oak, .105, 0, 0);
    const hinge = mesh(gate, new THREE.CylinderGeometry(.039, .039, .23, 16), brass, 0, 0, 0);
    hinge.rotation.x = Math.PI / 2;

    const signGroup = new THREE.Group();
    signGroup.position.set(-.99, 2.72, -.012);
    tower.add(signGroup);
    mesh(signGroup, roundedBox(.52, .59, .12, .041), trim, 0, 0, 0);
    for (const x of [-.196, .196]) for (const y of [-.22, .22]) {
      const screw = mesh(signGroup, new THREE.CylinderGeometry(.027, .027, .015, 16), brass, x, y, .069);
      screw.rotation.x = Math.PI / 2;
      mesh(signGroup, new THREE.BoxGeometry(.026, .005, .004), trim, x, y, .078, false);
    }
    const signLight = new THREE.PointLight(0x468eb7, .65, 1.4);
    signLight.position.set(0, 0, .16);
    signGroup.add(signLight);
    const bulb = new THREE.MeshStandardMaterial({ color: 0x468eb7, emissive: 0x468eb7, emissiveIntensity: 1.16, roughness: .34 });
    const blueLens = mesh(signGroup, new THREE.SphereGeometry(.124, 24, 16), bulb, 0, 0, .062, false);
    blueLens.scale.z = .40;
    const amberLens = mesh(signGroup, roundedBox(.188, .188, .077, .030), bulb, 0, 0, .083, false);
    amberLens.rotation.z = Math.PI / 4;

    const trayX = -.52;
    const trayZ = .69;
    const trayShape = profile([[0, 0], [.33, 0], [.37, .028], [.378, .102], [.357, .128], [.327, .117],
      [.28, .078], [.23, .047], [0, .041]], 54);
    mesh(tower, trayShape, brass, trayX, .17, trayZ);

    // Curva Matemática Helicoidal 3D (Espiral de 3.5 voltas)
    const helixPoints = [];
    const turns = 3.5;
    const height = 2.6;
    const radius = 0.65;
    const segments = 120;
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const angle = t * turns * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const y = 3.04 - (t * height);
      helixPoints.push(new THREE.Vector3(x, y, z));
    }
    // Saída tangente para a bandeja
    helixPoints.push(new THREE.Vector3(-.64, .375, .24));
    helixPoints.push(new THREE.Vector3(-.57, .294, .47));
    helixPoints.push(new THREE.Vector3(trayX, .294, trayZ));

    const helixCurve = new THREE.CatmullRomCurve3(helixPoints);
    helixCurve.arcLengthDivisions = 720;
    const pathLength = helixCurve.getLength();
    const tubeGeo = new THREE.TubeGeometry(helixCurve, 286, .091, 12, false);
    const tubeMat = new THREE.MeshPhysicalMaterial({
      color: 0xeaf9ff, roughness: .115, metalness: .06, transmission: .86,
      thickness: .028, ior: 1.46, clearcoat: .9
    });
    mesh(tower, tubeGeo, tubeMat, 0, 0, 0, false);
    for (const t of [.012, .20, .39, .58, .77, .98]) {
      const point = helixCurve.getPointAt(t);
      const cuff = mesh(tower, new THREE.TorusGeometry(.093, .009, 8, 20), brass, ...point, false);
      cuff.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), helixCurve.getTangentAt(t).normalize());
    }

    // Esfera de Latão Polido
    const ballGeo = new THREE.SphereGeometry(.071, 32, 24);
    const ballMat = MaterialFactory.brass(0.2, 0.95);
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    tower.add(ball);

    function resetBallToTop() {
      ball.position.set(.65, 3.153, 0);
      ball.rotation.set(0, 0, 0);
      gate.rotation.z = 0;
      window.game.progress = 0;
      window.game.speed = 0;
    }
    resetBallToTop();

    const game = window.game;
    const releaseButton = document.getElementById('btn-release');
    const pauseButton = document.getElementById('btn-pause');
    const message = document.getElementById('help-msg');
    let roundSeed = 1103;
    function scheduleNextSignal() {
      game.fsm = 'awaiting';
      roundSeed = (Math.imul(roundSeed, 1664525) + 1013904223) >>> 0;
      game.remaining = 1.35 + (roundSeed / 4294967296) * 2.45;
      updateSignalDisplay(false);
      message.textContent = 'Aguarde o losango dourado para liberar a esfera.';
    }

    function updateSignalDisplay(ready) {
      document.getElementById('signal-icon').className = 'signal-icon ' + (ready ? 'amber' : 'blue');
      const text = document.getElementById('signal-text');
      text.textContent = ready ? 'LIBERAR' : 'AGUARDAR';
      text.style.color = ready ? '#794300' : '#235a7b';
      blueLens.visible = !ready;
      amberLens.visible = ready;
      const tint = ready ? 0xffa420 : 0x398dbf;
      signLight.color.setHex(tint);
      bulb.color.setHex(tint);
      bulb.emissive.setHex(tint);
    }

    window.togglePause = function() {
      game.paused = !game.paused;
      pauseButton.textContent = game.paused ? 'Continuar' : 'Pausar';
      pauseButton.setAttribute('aria-pressed', String(game.paused));
      releaseButton.disabled = game.paused || !['awaiting', 'ready'].includes(game.fsm);
    };

    window.attemptRelease = function() {
      if (game.paused || lifecycle.isPaused) return;
      if (window.game.fsm === 'awaiting') {
        window.game.early++;
        document.getElementById('lbl-early').textContent = window.game.early;
        document.getElementById('help-msg').textContent = 'Ainda estávamos aguardando. Aguarde o sinal dourado.';
        audio.playClick(220, 0.05);
      } else if (window.game.fsm === 'ready') {
        window.game.fsm = 'releasing';
        game.remaining = .27;
        window.game.released++;
        document.getElementById('lbl-released').textContent = window.game.released;
        document.getElementById('btn-release').disabled = true;
        document.getElementById('help-msg').textContent = 'Esfera descendo a espiral mecânica...';

        // Abrir comporta
        audio.playClick(480, 0.04);
      }
    };

    scheduleNextSignal();

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (e.target.closest?.('button, input') || e.repeat) return;
      if (e.key === ' ' || e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        attemptRelease();
      }
    });

    let animId;
    let lastFrame = performance.now();
    const tangentAxis = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    function advance(delta) {
      switch (game.fsm) {
        case 'awaiting':
          game.remaining -= delta;
          if (game.remaining <= 0) {
            game.fsm = 'ready';
            document.getElementById('lbl-waited').textContent = ++game.waited;
            updateSignalDisplay(true);
            message.textContent = 'O sinal está pronto. Libere a esfera.';
          }
          break;
        case 'releasing':
          game.remaining = Math.max(0, game.remaining - delta);
          gate.rotation.z = (1 - game.remaining / .27) * -Math.PI / 3;
          ball.position.y = THREE.MathUtils.lerp(3.04, 3.153, game.remaining / .27);
          if (game.remaining === 0) {
            game.fsm = 'rolling';
            game.speed = .65;
          }
          break;
        case 'rolling': {
          const tangent = helixCurve.getTangentAt(game.progress);
          const acceleration = -tangent.y * 9.81 - .08 * game.speed;
          game.speed = THREE.MathUtils.clamp(game.speed + acceleration * delta, .30, 2.9);
          const travel = Math.min((1 - game.progress) * pathLength, game.speed * delta);
          game.progress = Math.min(1, game.progress + travel / pathLength);
          ball.position.copy(helixCurve.getPointAt(game.progress));
          tangentAxis.crossVectors(up, tangent).normalize();
          ball.rotateOnWorldAxis(tangentAxis, travel / .071);
          if (game.progress >= 1 - 1e-8) {
            game.fsm = 'caught';
            game.remaining = 1.1;
            audio.playClick(280, .08);
            message.textContent = 'Esfera recolhida na bandeja.';
          }
          break;
        }
        case 'caught':
          game.remaining -= delta;
          if (game.remaining <= 0) {
            resetBallToTop();
            releaseButton.disabled = false;
            game.round = (game.round % 5) + 1;
            document.getElementById('lbl-round').textContent = game.round + ' / 5';
            scheduleNextSignal();
          }
          break;
      }
    }

    function animate(now = performance.now()) {
      animId = requestAnimationFrame(animate);
      const delta = Math.min((now - lastFrame) / 1000, .20);
      lastFrame = now;
      if (lifecycle.isPaused) return;
      if (!game.paused) {
        if (game.fsm === 'rolling') {
          const steps = Math.max(1, Math.ceil(delta * 120));
          for (let i = 0; i < steps; i++) advance(delta / steps);
        } else {
          advance(delta);
        }
      }
      engineRenderer.render(scene, camera);
    }
    const lifecycle = new LifecycleManager({
      onPause: () => audio.setMuted(true),
      onResume: () => audio.setMuted(lifecycle.isMuted),
      onMute: muted => audio.setMuted(muted),
      dispose: () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', frameScene);
        engineRenderer.dispose();
        audio.dispose();
        lighting.dispose();
      }
    });
    animate();

  </script>
</body>
</html>
