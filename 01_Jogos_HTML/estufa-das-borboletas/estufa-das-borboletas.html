$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.slot!==undefined)return selectSlot(+d.slot);if(d.hab)return habitatAt(slot,d.hab);if(d.preset)return reset(d.preset);if(d.light){checkpoint();state.light=d.light;changed('Iluminação atualizada');return}switch(b.id){case'closePanel':tool='';renderUI();break;case'skip':guide=-1;renderUI();break;case'doPlant':plantAt(slot);break;case'remove':if(confirm('Remover a planta?')){checkpoint();state.plants[slot]=null;changed('Planta removida')}break;case'introduce':{checkpoint();let id=state.nextId++;state.agents.push(agent(id,0,0,hostSlots().includes(slot)?slot:hostSlots()[0]));changed('Ovo introduzido');break}case'pause':paused=!paused;renderUI();break;case'advance':checkpoint();advance(state,3);if(guide===2)guide=3;changed('Três dias se passaram');break;case'tutorial':guide=0;tool='plant';slot=3;rendererAdapter?.highlight(slot);renderUI();break;case'undo':undoStep();break;case'redo':undoStep(true);break;case'save':save();break;case'restore':restore();break;case'export':download();break;case'import':$('file').click();break;case'diagnose':notify(diagnose());break}});
