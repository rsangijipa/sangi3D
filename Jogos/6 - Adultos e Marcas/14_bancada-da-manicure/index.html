<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bancada da Manicure — Studio Lúmen Nails | Sangi3D</title>
  <style>
    :root {
      --bg: #1A1416;
      --card-bg: rgba(30, 22, 26, 0.92);
      --card-border: rgba(220, 160, 180, 0.28);
      --text: #F8F0F2;
      --text-muted: #B89EA6;
      --accent-nude: #D9A0A8;
      --accent-rose: #C25975;
      --accent-gold: #D8B06E;
      --accent-uv: #8A4FFF;
      --serif: "Italiana", Georgia, serif;
      --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--sans);
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .nav-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 10;
      background: linear-gradient(180deg, rgba(26,20,22,0.85) 0%, rgba(26,20,22,0) 100%);
      pointer-events: none;
    }
    .brand-logo {
      font-family: var(--serif); font-size: 20px; color: var(--accent-nude);
      letter-spacing: 1px; pointer-events: auto;
    }
    .cta-btn {
      padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: var(--accent-nude); color: #2A171D; border: none; cursor: pointer;
      pointer-events: auto; transition: transform 0.2s, background 0.2s;
    }
    .cta-btn:hover { background: #E5B2BA; transform: translateY(-1px); }

    .hud-panel {
      position: absolute; top: 72px; right: 20px; width: 340px; max-height: calc(100dvh - 90px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      z-index: 10;
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px;
      overflow-y: auto;
    }
    .hud-header h1 {
      font-family: var(--serif); font-size: 24px; font-weight: 400; color: #FFF; margin-bottom: 2px;
    }
    .hud-header p {
      font-size: 12px; color: var(--text-muted); line-height: 1.4;
    }

    .color-swatches {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .swatch {
      aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.2s, border-color 0.2s;
    }
    .swatch.active {
      transform: scale(1.15); border-color: #FFF; box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .option-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    }
    .btn-opt {
      padding: 8px 4px; font-size: 10px; font-weight: 600; text-align: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: var(--text); cursor: pointer; transition: all 0.2s;
    }
    .btn-opt.active {
      background: var(--accent-rose); border-color: var(--accent-nude); color: #FFF;
    }

    .dock-controls {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .btn-dock {
      padding: 10px 12px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: var(--text); cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .btn-dock.active {
      background: var(--accent-rose); border-color: var(--accent-nude); color: #FFF;
    }
    .btn-dock.uv-active {
      background: var(--accent-uv); border-color: #BA85FF; color: #FFF; box-shadow: 0 0 12px rgba(138,79,255,0.5);
    }

    @media (max-width: 768px) {
      .hud-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 50dvh;
        border-radius: 20px 20px 0 0; padding: 16px 18px 24px;
      }
    }
  :root{--bg:#ba928d;--card-bg:#fbefeb;--card-border:#dfbdbb;--text:#482a35;--text-muted:#765564;--accent-rose:#87435a;--accent-nude:#e4bbc5}
#canvas-container{width:calc(100% - 350px)}
.nav-bar{width:calc(100% - 350px);height:75px;padding:14px 34px;background:none}
.brand-logo{color:#703e51;font:34px/1 Georgia,serif;letter-spacing:-.04em}
.cta-btn{background:#834357;color:#fff7ee;min-height:42px;font-family:inherit}
.cta-btn:hover{background:#693148}
.hud-panel{inset:0 0 0 auto;width:350px;max-height:none;border-radius:0;box-shadow:none;background:linear-gradient(150deg,#fff8ef,#f7e6e7);padding:clamp(18px,4vh,42px) 20px 22px;gap:9px}
.hud-header h1{color:#482a35;font:400 43px/.98 Georgia,serif;letter-spacing:-.06em;margin-bottom:8px}
#design-status{margin-top:9px;min-height:31px;border-left:2px solid #be8092;padding-left:7px}
.btn-opt,.btn-dock{min-height:42px;background:#fff9f4;border-color:#d7b9be;font-size:12px;font-family:inherit}
.btn-opt:focus-visible,.btn-dock:focus-visible,.swatch:focus-visible{outline:2px solid #733751;outline-offset:3px}
.swatch{border-radius:8px;min-height:44px;height:44px;aspect-ratio:auto}.swatch.active{transform:none;border-color:#fff9f0;outline:2px solid #87435a}
.field-title,.length{font:650 11px/1.3 system-ui,sans-serif;color:var(--text-muted);text-transform:uppercase}
.length{display:flex;align-items:center;gap:12px}.length input{width:100%;accent-color:#87435a}
.finger-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.finger-row button{font-size:10px}
body.embed .nav-bar{background:none}.embed .brand-logo{display:none}
@media(max-width:760px){#canvas-container,.nav-bar{width:100%}#canvas-container{height:52dvh}.nav-bar{height:56px;padding:6px 13px}.brand-logo{font-size:25px}.hud-panel{top:52dvh;bottom:0;width:100%;padding:11px 15px 18px}.hud-header h1{font-size:30px}.btn-opt,.btn-dock{min-height:44px}.finger-row button{font-size:11px}}
</style>
  <script src="/Sistema/shared/sangi-bridge.js"></script>
</head>
<body>
  <div class="nav-bar">
    <div class="brand-logo">Studio Lúmen Nails</div>
    <button class="cta-btn" onclick="scheduleBooking()">Agendar horário</button>
  </div>

  <div id="canvas-container"></div>

  <div class="hud-panel" id="hud">
    <div class="hud-header">
      <h1>Crie suas unhas.</h1>
      <p>Passe o pincel sobre a unha de porcelana.</p><p id="design-status" role="status"></p>
    </div>

    <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600;">Formato das Unhas:</div>
    <div class="option-row">
      <button class="btn-opt active" id="shape-0" onclick="setShape(0)">Amendoado</button>
      <button class="btn-opt" id="shape-1" onclick="setShape(1)">Quadrado</button>
      <button class="btn-opt" id="shape-2" onclick="setShape(2)">Stiletto</button>
      <button class="btn-opt" id="shape-3" onclick="setShape(3)">Bailarina</button>
    </div>

    <label class="length">Comprimento <input id="length" type="range" min="0" max="100" value="65"></label><div class="field-title">Esmaltes do carrossel</div>
    <div class="color-swatches">
      <div class="swatch active" style="background:#7A1E32;" onclick="setColor('#7A1E32', this)"></div>
      <div class="swatch" style="background:#D96B7D;" onclick="setColor('#D96B7D', this)"></div>
      <div class="swatch" style="background:#D9A899;" onclick="setColor('#D9A899', this)"></div>
      <div class="swatch" style="background:#4A1521;" onclick="setColor('#4A1521', this)"></div>
      <div class="swatch" style="background:#E2BA68;" onclick="setColor('#E2BA68', this)"></div>
      <div class="swatch" style="background:#2C3E50;" onclick="setColor('#2C3E50', this)"></div>
      <div class="swatch" style="background:#FFFFFF;" onclick="setColor('#FFFFFF', this)"></div>
      <div class="swatch" style="background:#111111;" onclick="setColor('#111111', this)"></div>
      <div class="swatch" style="background:#708238;" onclick="setColor('#708238', this)"></div>
      <div class="swatch" style="background:#8E44AD;" onclick="setColor('#8E44AD', this)"></div>
    </div>

    <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600;">Nail Art & Decoração:</div>
    <div class="option-row">
      <button class="btn-opt" id="art-none" onclick="setNailArt('none')">Lisa</button>
      <button class="btn-opt" id="art-french" onclick="setNailArt('french')">Francesinha</button>
      <button class="btn-opt" id="art-glitter" onclick="setNailArt('glitter')">Glitter</button>
      <button class="btn-opt" id="art-gems" onclick="setNailArt('gems')">Pedrinhas</button>
    </div>

    <div style="font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600;">Acabamento Final:</div>
    <div class="option-row">
      <button class="btn-opt active" id="fin-gloss" onclick="setFinish('gloss')">Brilho</button>
      <button class="btn-opt" id="fin-matte" onclick="setFinish('matte')">Fosco</button>
      <button class="btn-opt" id="fin-chrome" onclick="setFinish('chrome')">Cromado</button>
      <button class="btn-opt" id="fin-glaze" onclick="setFinish('glaze')">Glazed</button>
    </div>

    <div class="field-title">Pintar uma unha</div><div class="finger-row" id="finger-row"></div><div class="dock-controls">
      <button class="btn-dock active" id="btn-paint" onclick="paintAll()">Pincelar todas</button>
      <button class="btn-dock" id="btn-uv" onclick="toggleUVCabin()">Cabine UV</button>
      <button class="btn-dock" id="btn-clean" onclick="clearNails()">Remover</button>
      <button class="btn-dock" id="btn-save" onclick="saveDesign()">Salvar imagem</button>
    </div>
  </div>


<script type="module">
import * as THREE from '/Sistema/shared/vendor/three.module.js';
import {createStudioEnvironment} from '/Sistema/shared/engine/studio-environment.js';

const $=id=>document.getElementById(id);
const names=['Polegar','Indicador','Médio','Anelar','Mínimo'];
const shades=Array.from(document.querySelectorAll('.swatch'),e=>e.getAttribute('style').match(/#[A-Fa-f0-9]{6}/)[0]);
const shadeNames=['Vinho','Rosa queimado','Nude','Cereja escura','Champanhe','Azul ardósia','Leite','Ônix','Oliva','Ametista'];
const shapes=['Amendoado','Quadrado','Stiletto','Bailarina'];
const finishes={gloss:[.17,.05,1],matte:[.73,0,0],chrome:[.17,.86,.68],glaze:[.24,.22,.87]};
const state={shape:0,length:.65,color:0,finish:'gloss',art:'none',curing:false};
const porcelain='#f1d2c7';
const setStatus=s=>$('design-status').textContent=s;
let view=null,paused=false,disposed=false,timer,muted=false,audio;
document.body.classList.toggle('embed',new URLSearchParams(location.search).get('embed')==='1');
setStatus('Escolha um esmalte. Toque ou arraste sobre a unha para pintar.');
const nails=names.map((name,i)=>{
  const c=document.createElement('canvas');c.width=192;c.height=384;
  const ctx=c.getContext('2d');ctx.fillStyle=i===1||i===2?shades[0]:porcelain;ctx.fillRect(0,0,c.width,c.height);
  const map=new THREE.CanvasTexture(c);map.colorSpace=THREE.SRGBColorSpace;map.anisotropy=4;
  const button=document.createElement('button');button.className='btn-opt';button.textContent=name;
  button.onclick=()=>{if(!state.curing){coat(i);beep(380);setStatus(name+' · '+shadeNames[state.color])}};
  $('finger-row').append(button);
  return {c,ctx,map,button};
});
document.querySelectorAll('.swatch').forEach((element,i)=>{
  const button=document.createElement('button');button.className=element.className;button.style.cssText=element.style.cssText;
  button.type='button';button.title=shadeNames[i];button.setAttribute('aria-label',shadeNames[i]);button.setAttribute('aria-pressed',i===0);
  button.onclick=()=>selectColor(i);element.replaceWith(button);
});
function beep(hz){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(muted||paused||!Audio)return;
  audio ||= new Audio();
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
  o.frequency.value=hz;g.gain.setValueAtTime(.037,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);
  o.connect(g).connect(audio.destination);o.start();o.stop(t+.14);
}
function active(selector,id){
  document.querySelectorAll(selector).forEach(b=>{const on=b.id===id;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});
}
function selectColor(i){
  state.color=i;document.querySelectorAll('.swatch').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',i===j)});
  view?.selectBottle(i);beep(450);setStatus(shadeNames[i]+' selecionado.');
}
function coat(i,hex=shades[state.color]){
  const m=nails[i];m.ctx.fillStyle=hex;m.ctx.fillRect(0,0,m.c.width,m.c.height);m.map.needsUpdate=true;
  view?.invalidate();
}
function stroke(i,uv,previous){
  const m=nails[i],ctx=m.ctx,w=m.c.width,h=m.c.height,x=uv.x*w,y=(1-uv.y)*h;
  ctx.strokeStyle=shades[state.color];ctx.lineCap='round';ctx.lineWidth=53;
  ctx.beginPath();ctx.moveTo(previous?previous.x*w:x-.3,previous?(1-previous.y)*h:y);ctx.lineTo(x,y);ctx.stroke();
  m.map.needsUpdate=true;view?.invalidate();
}
window.setColor=hex=>{const i=shades.indexOf(hex.toUpperCase());if(i>=0)selectColor(i)};
window.setShape=i=>{state.shape=i;active('[id^="shape-"]','shape-'+i);view?.rebuild();setStatus('Formato '+shapes[i].toLowerCase()+' aplicado.')};
window.setFinish=key=>{state.finish=key;active('[id^="fin-"]','fin-'+key);view?.decorate();setStatus($('fin-'+key).textContent+' aplicado.')};
window.setNailArt=key=>{state.art=key;active('[id^="art-"]','art-'+key);view?.decorate();setStatus($('art-'+key).textContent+' aplicado.')};
window.paintAll=()=>{if(!state.curing){nails.forEach((_,i)=>coat(i));beep(320);setStatus('Unhas pintadas com '+shadeNames[state.color]+'.')}};
window.clearNails=()=>{nails.forEach((_,i)=>coat(i,porcelain));window.setNailArt('none');setStatus('Esmalte removido.')};
$('length').oninput=e=>{state.length=e.target.valueAsNumber/100;view?.rebuild()};
function stopCure(msg){
  clearTimeout(timer);state.curing=false;$('btn-uv').classList.remove('uv-active');$('btn-uv').setAttribute('aria-pressed',false);
  $('btn-uv').textContent='Cabine UV';view?.invalidate();if(msg)setStatus(msg);
}
window.toggleUVCabin=()=>{
  if(state.curing){stopCure('Cabine UV desligada.');return}
  if(!view){setStatus('Cabine UV indisponível neste aparelho.');return}
  state.curing=true;$('btn-uv').classList.add('uv-active');$('btn-uv').setAttribute('aria-pressed',true);
  $('btn-uv').textContent='Em cura · 3 s';view.invalidate();beep(1030);setStatus('Curando o acabamento na cabine UV.');
  timer=setTimeout(()=>{stopCure('Cura concluída. Sua imagem está pronta para salvar.');beep(1260)},3000);
};
window.saveDesign=()=>{if(view){view.save();setStatus('Imagem do seu design salva em PNG.')}};
window.scheduleBooking=()=>{
  parent.postMessage({type:'cta',tipo:'cta',target:'agendamento',cor:shades[state.color],formato:shapes[state.shape],acabamento:state.finish},'*');
  setStatus('Studio Lúmen Nails é uma demonstração. Nenhum agendamento foi enviado.');
};
window.addEventListener('keydown',e=>{if(!e.repeat&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!state.curing&&!(e.target instanceof HTMLInputElement)&&/^[1-5]$/.test(e.key))coat(+e.key-1)});
active('[id^="shape-"]','shape-0');active('[id^="art-"]','art-none');active('[id^="fin-"]','fin-gloss');

function makeScene(){
  const root=$('canvas-container'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.07,34);
  scene.background=new THREE.Color(0xb68e87);scene.fog=new THREE.FogExp2(0xbc938d,.045);
  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.07;
  renderer.shadowMap.enabled=true;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
  renderer.shadowMap.type=THREE.PCFShadowMap;root.append(renderer.domElement);
  const env=createStudioEnvironment(renderer);scene.environment=env.texture;scene.environmentIntensity=.86;
  const std=(color,roughness=.43,metalness=0,extra={})=>new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
  const phys=(color,roughness=.27,extra={})=>new THREE.MeshPhysicalMaterial({color,roughness,...extra});
  function mesh(parent,geo,mat,x=0,y=0,z=0,shadow=true){
    const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;parent.add(m);return m;
  }
  const box=(parent,x,y,z,w,h,d,mat)=>mesh(parent,new THREE.BoxGeometry(w,h,d),mat,x,y,z,false);
  const lathe=(parent,points,mat,x=0,y=0,z=0,steps=48)=>mesh(parent,new THREE.LatheGeometry(points.map(([r,h])=>new THREE.Vector2(r,h)),steps),mat,x,y,z);
  const torus=(parent,r,t,mat,x,y,z)=>mesh(parent,new THREE.TorusGeometry(r,t,9,56),mat,x,y,z);
  function rounded(parent,w,h,d,r,mat,x,y,z,b=.022){
    const s=new THREE.Shape(),l=-w/2,p=-d/2;
    s.moveTo(l+r,p);s.lineTo(-l-r,p);s.quadraticCurveTo(-l,p,-l,p+r);
    s.lineTo(-l,-p-r);s.quadraticCurveTo(-l,-p,-l-r,-p);
    s.lineTo(l+r,-p);s.quadraticCurveTo(l,-p,l,-p-r);
    s.lineTo(l,p+r);s.quadraticCurveTo(l,p,l+r,p);
    const geo=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:10,steps:1});
    geo.translate(0,0,-h/2);geo.rotateX(-Math.PI/2);
    const positions=geo.attributes.position,normals=geo.attributes.normal,uvs=geo.attributes.uv;
    for(let i=0;i<positions.count;i++){
      const px=positions.getX(i),py=positions.getY(i),pz=positions.getZ(i);
      if(Math.abs(normals.getY(i))>.42)uvs.setXY(i,px/(w+2*b)+.5,pz/(d+2*b)+.5);
      else if(Math.abs(normals.getX(i))>Math.abs(normals.getZ(i)))uvs.setXY(i,pz/(d+2*b)+.5,py/(h+2*b)+.5);
      else uvs.setXY(i,px/(w+2*b)+.5,py/(h+2*b)+.5);
    }
    return mesh(parent,geo,mat,x,y,z);
  }
  let seed=8631;
  const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
  function texture(w,h,draw){
    const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);return t;
  }
  const marble=texture(1536,1536,(c,w,h)=>{
    c.fillStyle='#e8d9cd';c.fillRect(0,0,w,h);
    for(let i=0;i<320;i++){
      const x=random()*w,y=random()*h,r=45+random()*290,g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,i%3?'#fff5e996':'#9b6f6643');g.addColorStop(1,'#c1a29500');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
    }
    for(let i=0;i<101;i++){
      const y=(i%9-3)*223+(random()-.5)*76,phase=(i%9)*1.74+(random()-.5)*.24;c.beginPath();
      for(let x=-14;x<=w+14;x+=6){
        const f=y+x*.48+Math.sin(x*.004+phase)*83+Math.sin(x*.016+phase)*17+Math.sin(x*.048+phase)*5;
        if(x===-14)c.moveTo(x,f);else c.lineTo(x,f);
      }
      c.lineWidth=.35+random()*2.5;c.strokeStyle=i%5?'#97716222':'#76594c33';c.stroke();
    }
    for(let i=0;i<60000;i++){c.fillStyle=i%2?'#412d2814':'#ffffff31';c.fillRect(random()*w,random()*h,1,1)}
  });
  const weave=texture(512,512,(c,w,h)=>{
    c.fillStyle='#be7b8c';c.fillRect(0,0,w,h);
    for(let i=0;i<43000;i++){c.fillStyle=i%2?'#f9bac943':'#5b293143';c.fillRect(random()*w,random()*h,1+random(),2+random()*3)}
    for(let i=0;i<h;i+=4){c.fillStyle=i%8?'#fff6ef23':'#48272f24';c.fillRect(0,i,w,1)}
  });
  const wallMap=texture(768,512,(c,w,h)=>{
    c.fillStyle='#d4a8a0';c.fillRect(0,0,w,h);
    for(let i=0;i<130;i++){
      const x=random()*w,y=random()*h,r=12+random()*130,g=c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,i%2?'#f5ccc164':'#703f4724');g.addColorStop(1,'#d9a7a100');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
    }
