<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Órgão do Perfumista — Maison Âmbar | Sangi3D</title>
  <style>
    :root {
      --bg: #14100D;
      --card-bg: rgba(24, 18, 14, 0.92);
      --card-border: rgba(220, 170, 95, 0.28);
      --text: #F7EFE8;
      --text-muted: #BFAEA0;
      --accent-amber: #D68938;
      --accent-gold: #E8C170;
      --accent-ebony: #241A14;
      --serif: "Bodoni Moda", "Didot", serif;
      --sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--sans);
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .nav-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 10;
      background: linear-gradient(180deg, rgba(20,16,13,0.9) 0%, rgba(20,16,13,0) 100%);
      pointer-events: none;
    }
    .brand-logo {
      font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--accent-gold);
      letter-spacing: 1px; pointer-events: auto;
    }
    .cta-btn {
      padding: 8px 18px; border-radius: 4px; font-size: 12px; font-weight: 600;
      background: var(--accent-gold); color: #14100D; border: none; cursor: pointer;
      pointer-events: auto; transition: transform 0.2s, background 0.2s;
    }
    .cta-btn:hover { background: #F2D28E; transform: translateY(-1px); }

    .hud-panel {
      position: absolute; top: 72px; right: 20px; width: 340px; max-height: calc(100dvh - 90px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
      z-index: 10;
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px;
      overflow-y: auto;
    }
    .hud-header h1 {
      font-family: var(--serif); font-size: 24px; font-weight: 500; color: #FFF; margin-bottom: 2px;
    }
    .hud-header p {
      font-size: 12px; color: var(--text-muted); line-height: 1.4;
    }

    .essence-tier-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    }
    .tab-btn {
      padding: 8px 4px; font-size: 11px; font-weight: 600; text-align: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; color: var(--text); cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active {
      background: #73431D; border-color: var(--accent-gold); color: #FFF;
    }

    .essence-list {
      display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto;
    }
    .essence-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08); font-size: 12px; cursor: pointer;
      transition: background 0.2s;
    }
    .essence-item:hover {
      background: rgba(214,137,56,0.18); border-color: var(--accent-gold);
    }

    .formula-card {
      background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(232,193,112,0.2); font-size: 11px;
    }
    .formula-row {
      display: flex; justify-content: space-between; margin-bottom: 4px; color: var(--text-muted);
    }

    .dock-controls {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .btn-dock {
      padding: 10px 12px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: var(--text); cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .btn-dock.primary {
      background: var(--accent-amber); border-color: var(--accent-gold); color: #FFF;
    }
    .btn-dock.primary:hover { background: #E69643; }

    @media (max-width: 768px) {
      .hud-panel {
        top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 50dvh;
        border-radius: 20px 20px 0 0; padding: 16px 18px 24px;
      }
    }
    .tab-btn, .btn-dock { min-height: 44px; }
    .essence-item { color: var(--text); min-height: 44px; width: 100%; text-align: left; gap: 8px; }
    .essence-item span { flex: 1; }
    .essence-item i { margin-right: 3px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #fff6; }
    .essence-item[aria-pressed="true"] { border-color: #e7be78; background: #8e56324d; }
    .selection { font-size: 12px; color: #edc486; }
    #result-line { min-height: 32px; color: #e5cba6; font-size: 12px; line-height: 1.35; }
    dialog { margin: auto; padding: 20px; background: #261a13; color: #fff0d7; border: 1px solid #d8aa6b; border-radius: 12px; }
    dialog form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    dialog h2, dialog label, dialog input { grid-column: 1 / -1; }
    dialog input, dialog button { font: inherit; min-height: 44px; padding: 7px; }
    dialog::backdrop { background: #110a06a8; }
    button:focus-visible, input:focus-visible { outline: 2px solid #f5d38e; outline-offset: 2px; }
    @media (max-width: 768px) {
      #canvas-container { height: 57dvh; }
      .hud-panel { max-height: 46dvh; gap: 7px; }
      .hud-header h1 { font-size: 21px; }
      .hud-header p { display: none; }
      .essence-list { min-height: 54px; max-height: 99px; flex-shrink: 0; }
      .nav-bar { height: 47px; padding: 0 13px; }
    }
  </style>
  <script src="/Sistema/shared/sangi-bridge.js"></script>
</head>
<body>
  <div class="nav-bar">
    <div class="brand-logo">Maison Âmbar</div>
    <button class="cta-btn" onclick="discoverFragrance()">Descobrir fragrâncias</button>
  </div>

  <div id="canvas-container"></div>

  <div class="hud-panel" id="hud">
    <div class="hud-header">
      <h1>Componha um aroma.</h1>
      <p>Selecione um frasco na estante ou escolha uma essência para dosar com a pipeta.</p>
    </div>

    <div class="essence-tier-tabs">
      <button class="tab-btn active" id="tab-0" onclick="setTier(0)">1. Saída</button>
      <button class="tab-btn" id="tab-1" onclick="setTier(1)">2. Coração</button>
      <button class="tab-btn" id="tab-2" onclick="setTier(2)">3. Fundo</button>
    </div>

    <p id="selection" class="selection"></p>
    <div class="essence-list" id="essence-list">
      <!-- Injected dynamically -->
    </div>

    <div class="formula-card">
      <div class="formula-row">
        <span>Volume no Frasco:</span>
        <span id="drops-count" style="color:var(--accent-gold); font-weight:600;">0 gotas</span>
      </div>
      <div class="formula-row">
        <span>Perfil Olfativo:</span>
        <span id="scent-profile">Equilibrando...</span>
      </div>
    </div>

    <div class="dock-controls">
      <button class="btn-dock primary" id="btn-drop" onclick="dropActiveEssence()">💧 Pingar Gota</button>
      <button class="btn-dock" id="btn-name" onclick="nameCreation()">🏷️ Rotular</button>
      <button class="btn-dock" id="btn-clear" onclick="resetFormula()">↺ Limpar</button>
      <button class="btn-dock" id="btn-sniff" onclick="smellTest()">🌸 Fita Olfativa</button>
    </div>
    <p id="result-line" role="status">A fórmula comporta até 24 gotas.</p>
  </div>
  <dialog id="formula-dialog" aria-labelledby="formula-title">
    <form method="dialog">
      <h2 id="formula-title">Rotular a criação</h2>
      <label for="formula-name">Nome da fragrância</label>
      <input id="formula-name" maxlength="32" placeholder="Âmbar Noturno" required>
      <button value="cancel" formnovalidate>Cancelar</button>
      <button value="save">Gravar no frasco</button>
    </form>
  </dialog>

  <script type="importmap">
    {
      "imports": {
        "three": "/Sistema/shared/vendor/three.module.js",
        "three/addons/": "/Sistema/shared/vendor/addons/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createStudioEnvironment } from '/Sistema/shared/engine/studio-environment.js';

    import { buildPerfumery } from './perfumery.js';

    // Olfactory Library
    const ESSENCES = [
      { id: 'bergamot', tier: 0, name: 'Bergamota Siciliana', color: 0xF5DE68, drops: 0 },
      { id: 'lemon', tier: 0, name: 'Limão Cravo', color: 0xE8F568, drops: 0 },
      { id: 'neroli', tier: 0, name: 'Néroli do Mediterrâneo', color: 0xFFE0B2, drops: 0 },
      { id: 'rose', tier: 1, name: 'Rosa Centifólia de Grasse', color: 0xE8607A, drops: 0 },
      { id: 'jasmine', tier: 1, name: 'Jasmim Sambac', color: 0xFFF5E0, drops: 0 },
      { id: 'orange', tier: 1, name: 'Flor de Laranjeira', color: 0xFFA726, drops: 0 },
      { id: 'amber', tier: 2, name: 'Âmbar Dourado Resinoso', color: 0xD68938, drops: 0 },
      { id: 'sandalwood', tier: 2, name: 'Sândalo Real da Índia', color: 0x8D5B36, drops: 0 },
      { id: 'vanilla', tier: 2, name: 'Baunilha Bourbon', color: 0xD7B88C, drops: 0 },
      { id: 'cedar', tier: 2, name: 'Cedro do Atlas', color: 0x5C4033, drops: 0 }
    ];

    let currentTier = 0;
    let selectedEssence = ESSENCES[0];
    let totalDrops = 0;

    // Web Audio Synthesizer
    let audioCtx = null;
    let masterGain = null;
    let isMuted = false;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);
    }

    function playGlassClink() {
      if (!audioCtx || isMuted) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2400, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + 0.35);
    }

    function playDripSound() {
      if (!audioCtx || isMuted) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain); gain.connect(masterGain);
      osc.start(now); osc.stop(now + 0.13);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#392820');
    const camera = new THREE.PerspectiveCamera(34, 1, .09, 35);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    const environment = createStudioEnvironment(renderer);
    scene.environment = environment.texture;
    scene.environmentIntensity = .86;
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    controls.enablePan = false;
    controls.minDistance = 2.2;
    controls.maxDistance = 6.2;
    controls.minPolarAngle = .45;
    controls.maxPolarAngle = 1.48;
    controls.minAzimuthAngle = -.86;
    controls.maxAzimuthAngle = .86;
    scene.add(new THREE.HemisphereLight('#f5e6cc', '#736156', 1.61));
    const sun = new THREE.DirectionalLight('#ffdbab', 3.0);
    sun.position.set(-2.7, 4.7, 3.2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -2.8;
    sun.shadow.camera.right = 2.8;
    sun.shadow.camera.top = 2.8;
    sun.shadow.camera.bottom = -2.8;
    sun.shadow.normalBias = .018;
    sun.shadow.bias = -.00022;
    sun.shadow.radius = 3;
    scene.add(sun);
    const bounce = new THREE.DirectionalLight('#b8cbd6', 1.05);
    bounce.position.set(1.5, 2.4, -2);
    scene.add(bounce);
    const design = buildPerfumery(scene, ESSENCES);
    const { drop, liquid, liquidMaterial, pipette, strip } = design;
    const result = document.getElementById('result-line');
    const totalUI = document.getElementById('drops-count');
    const selection = document.getElementById('selection');
    const blend = new THREE.Color();
    const noteColor = new THREE.Color();
    let falling = -1;
    let targetLevel = 0;
    let fluidHeight = 0;
    let sniffAt = -1;
    const maxDrops = 24;
    const maxEssences = 6;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function renderEssences() {
      const list = document.getElementById('essence-list');
      const items = ESSENCES.filter(essence => essence.tier === currentTier);
      const active = document.activeElement?.dataset.essence;
      list.replaceChildren(...items.map(essence => {
        const item = document.createElement('button');
        item.className = 'essence-item';
        item.dataset.essence = essence.id;
        item.setAttribute('aria-pressed', String(essence === selectedEssence));
        const mark = document.createElement('i');
        mark.style.backgroundColor = '#' + essence.color.toString(16).padStart(6, '0');
        const name = document.createElement('span');
        name.textContent = essence.name;
        const count = document.createElement('small');
        count.textContent = essence.drops + ' gts';
        item.append(mark, name, count);
        item.onclick = () => selectEssence(essence);
        return item;
      }));
      if (active) list.querySelector('[data-essence="' + active + '"]')?.focus({ preventScroll: true });
    }

    function selectEssence(essence, bottle, audible = true) {
      if (audible) { initAudio(); playGlassClink(); }
      selectedEssence = essence;
      currentTier = essence.tier;
      selection.textContent = essence.name;
      design.selectBottle(essence, bottle);
      document.querySelectorAll('.tab-btn').forEach((button, index) => {
        button.classList.toggle('active', index === currentTier);
        button.setAttribute('aria-pressed', String(index === currentTier));
      });
      renderEssences();
    }
    window.setTier = index => {
      const first = ESSENCES.find(essence => essence.tier === index);
      if (first) selectEssence(first, undefined, false);
    };
    selectEssence(selectedEssence, undefined, false);

    let pointerStart;
    renderer.domElement.addEventListener('pointerdown', event => {
      pointerStart = [event.clientX, event.clientY];
    });
    renderer.domElement.addEventListener('pointerup', event => {
      if (!pointerStart || Math.hypot(event.clientX - pointerStart[0], event.clientY - pointerStart[1]) > 8) return;
      pointerStart = undefined;
      const bounds = renderer.domElement.getBoundingClientRect();
      mouse.set((event.clientX - bounds.left) / bounds.width * 2 - 1, 1 - (event.clientY - bounds.top) / bounds.height * 2);
      raycaster.setFromCamera(mouse, camera);
      const bottle = raycaster.intersectObjects(design.clickable, false)[0]?.object;
      if (bottle) selectEssence(bottle.userData.essence, bottle);
    });

    window.dropActiveEssence = function() {
      if (falling >= 0) return;
      if (totalDrops >= maxDrops) { result.textContent = 'Frasco cheio. Rotule a fórmula ou comece outra.'; return; }
      if (!selectedEssence.drops && ESSENCES.filter(essence => essence.drops > 0).length >= maxEssences) {
        result.textContent = 'Sua fórmula já tem seis essências. Continue com uma delas.';
        return;
      }
      initAudio();
      selectedEssence.drops++;
      totalDrops++;
      drop.material.color.setHex(selectedEssence.color);
      drop.position.y = .677;
      drop.visible = true;
      falling = 0;
      totalUI.textContent = totalDrops + (totalDrops === 1 ? ' gota' : ' gotas');
      result.textContent = selectedEssence.name + ' adicionada.';
      updateProfile();
      renderEssences();
    };

    function updateProfile() {
      const top = ESSENCES.filter(e => e.tier === 0).reduce((acc, v) => acc + v.drops, 0);
      const heart = ESSENCES.filter(e => e.tier === 1).reduce((acc, v) => acc + v.drops, 0);
      const base = ESSENCES.filter(e => e.tier === 2).reduce((acc, v) => acc + v.drops, 0);

      let text = 'Olfato Harmônico';
      if (top > heart && top > base) text = 'Cítrico & Fresco Radiante';
      else if (heart > top && heart > base) text = 'Floral Opulento Precioso';
      else if (base > top && base > heart) text = 'Oriental Ambarado Profundo';

      document.getElementById('scent-profile').textContent = text;
    }

    window.resetFormula = function() {
      ESSENCES.forEach(essence => essence.drops = 0);
      falling = -1;
      drop.visible = false;
      totalDrops = targetLevel = fluidHeight = 0;
      liquid.visible = false;
      design.nameFlacon('');
      totalUI.textContent = '0 gotas';
      document.getElementById('scent-profile').textContent = 'À espera da primeira gota';
      result.textContent = 'Frasco limpo.';
      renderEssences();
    };

    window.nameCreation = function() {
      if (!totalDrops) { result.textContent = 'Adicione ao menos uma gota antes de rotular.'; return; }
      const dialog = document.getElementById('formula-dialog');
      dialog.showModal();
    };
    document.getElementById('formula-dialog').addEventListener('close', event => {
      if (event.target.returnValue !== 'save') return;
      const name = document.getElementById('formula-name').value.trim();
      if (!name) return;
      design.nameFlacon(name);
      result.textContent = 'Frasco rotulado · ' + name;
    });

    window.smellTest = function() {
      if (!totalDrops) { result.textContent = 'Prepare uma mistura para testar na fita.'; return; }
      initAudio();
      playGlassClink();
      sniffAt = 0;
      const notes = [0, 1, 2].map(tier => ESSENCES.filter(essence => essence.tier === tier && essence.drops)
        .sort((a, b) => b.drops - a.drops)[0]?.name).filter(Boolean);
      result.textContent = 'Na fita · ' + notes.join(', ');
    };
    window.discoverFragrance = function() {
      const families = ['Citrus d’Or', 'Jardim de Grasse', 'Âmbar de Cedro'];
      const weights = [0, 1, 2].map(tier => ESSENCES.reduce((sum, essence) => sum + (essence.tier === tier ? essence.drops : 0), 0));
      const favorite = weights.indexOf(Math.max(...weights));
      result.textContent = totalDrops ? 'Do catálogo · ' + families[favorite] : 'Catálogo · ' + families.join(' · ');
      if (window.parent !== window) window.parent.postMessage({ type: 'cta', target: 'catalogo', perfil: families[favorite] }, location.origin);
    };

    let frame = 0;
    let paused = false;
    let disposed = false;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const resize = () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6, Math.sqrt(2250000 / Math.max(1, w * h))));
      renderer.setSize(w, h, false);
    };
    const observer = new ResizeObserver(resize);
    observer.observe(container);
    const narrow = matchMedia('(max-width: 768px)');
    function homeView() {
      if (narrow.matches) {
        camera.position.set(.53, 1.58, 4.45);
        controls.target.set(-.11, .80, -.25);
      } else {
        camera.position.set(1.35, 1.68, 3.82);
        controls.target.set(.54, .83, -.10);
      }
      controls.update();
      resize();
    }
    homeView();
    narrow.addEventListener('change', homeView);
    window.addEventListener('sangi:pause', () => { paused = true; audioCtx?.suspend(); });
    window.addEventListener('sangi:resume', () => { paused = false; });
    window.addEventListener('sangi:mute', event => {
      isMuted = event.detail?.muted ?? true;
      if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(isMuted ? 0 : .45, audioCtx.currentTime, .03);
    });
    window.addEventListener('sangi:dispose', () => {
      disposed = true;
      cancelAnimationFrame(frame);
      observer.disconnect();
      narrow.removeEventListener('change', homeView);
      controls.dispose();
      if (audioCtx) { void audioCtx.close().catch(() => {}); audioCtx = null; }
      environment.dispose();
      renderer.dispose();
    });

    let lastTime = performance.now();
    function animate(time) {
      if (disposed) return;
      frame = requestAnimationFrame(animate);
      const dt = Math.min((time - lastTime) / 1000, .08);
      lastTime = time;
      if (paused || document.hidden) return;
      if (falling >= 0) {
        falling += reduced ? .27 : dt;
        pipette.position.y = .682 - Math.sin(Math.min(1, falling / .29) * Math.PI) * .024;
        drop.position.y = .677 - Math.min(.58, falling * falling * 6.2);
        if (falling >= .29) {
          drop.visible = false;
          falling = -1;
          targetLevel = Math.min(.263, totalDrops * .0108);
          blend.setRGB(0, 0, 0);
          ESSENCES.forEach(essence => blend.add(noteColor.setHex(essence.color).multiplyScalar(essence.drops / totalDrops)));
          liquidMaterial.color.copy(blend);
          playDripSound();
        }
      }
      fluidHeight = THREE.MathUtils.damp(fluidHeight, targetLevel, 9, dt);
      if (targetLevel > 0) {
        liquid.visible = true;
        liquid.scale.y = Math.max(.001, fluidHeight);
        liquid.position.y = .111 + fluidHeight * .5;
      }
      if (sniffAt >= 0) {
        sniffAt += dt * 1.38;
        strip.position.y = .014 + Math.sin(Math.min(1, sniffAt) * Math.PI) * .20;
        strip.rotation.z = Math.sin(Math.min(1, sniffAt) * Math.PI) * -.67;
        if (sniffAt >= 1) sniffAt = -1;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    frame = requestAnimationFrame(animate);
  </script>
</body>
</html>
