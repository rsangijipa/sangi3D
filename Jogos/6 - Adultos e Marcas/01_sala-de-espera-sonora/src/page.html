<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Monte sua paisagem sonora em uma sala de espera 3D.">
<meta name="theme-color" content="#221914">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233e3027'/%3E%3Cpath d='M7 19c4-7 6-7 9 0s6 7 9 0M7 12c4-7 6-7 9 0s6 7 9 0' fill='none' stroke='%23e5c392' stroke-width='2'/%3E%3C/svg%3E">
<title>Sala de Espera Sonora</title>
<style>/*FONTS*/ /*STYLE*/</style>
<script>/*BRAND*/</script>
<script type="importmap">/*IMPORTS*/</script>
</head>
<body>
<main id="sala">
  <div id="visual" aria-hidden="true"><img id="still" alt="" hidden><div id="canvas"></div></div>
  <header class="navigation glass">
    <a class="wordmark" href="#inicio" data-nav="inicio"></a>
    <nav id="nav" aria-label="Navegação">
      <a href="#inicio" data-nav="inicio" aria-current="page">Início</a>
      <a href="#servicos" data-nav="servicos">Serviços</a>
      <a href="#sobre" data-nav="sobre">Sobre</a>
      <a href="#contato" data-nav="contato">Contato</a>
    </nav>
    <button class="icon-button nav-menu" data-action="menu" aria-expanded="false" aria-controls="nav" aria-label="Menu"></button>
    <a class="cta" data-cta href="#contato"></a>
  </header>
  <a class="cta embed-cta" data-cta href="#contato" hidden></a>
  <section class="hero" aria-labelledby="titulo">
    <h1 id="titulo"></h1>
    <p id="apoio"></p>
    <div id="guide" class="glass">
      <button id="step-button" data-action="guide" aria-controls="guide-steps" aria-expanded="false">
        <span id="step-label"></span><span class="guide-arrow" aria-hidden="true">⌄</span>
        <span class="step-track" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <ol id="guide-steps" hidden></ol>
    </div>
  </section>
  <div id="restore-bar" class="glass" hidden><button id="restore" data-action="collapse">Mostrar controles</button><button class="icon-button" data-action="sound" aria-label="Ligar som" aria-pressed="false"></button></div>
  <div class="bottom">
    <div id="hud-slot">
      <section id="breath" class="glass" aria-labelledby="breath-title" hidden>
        <div class="breath-orb" aria-hidden="true"></div>
        <div class="breath-copy"><h2 id="breath-title">Respirar 1 minuto</h2><p id="breath-instruction"></p><progress id="breath-progress" max="60" value="0" aria-label="Progresso da pausa"></progress></div>
        <button class="quiet" data-action="stop">Encerrar</button>
      </section>
      <section id="mixer" class="glass" aria-labelledby="mixer-title" hidden>
        <header><h2 id="mixer-title">Volumes da sala</h2><button class="icon-button" data-action="mixer" aria-label="Fechar volumes"></button></header>
        <div id="sliders"></div>
        <label class="slider-row" for="curtain"><span>Abertura da cortina</span><input id="curtain" type="range" min="0" max="100" value="36"></label>
      </section>
      <p id="prompt" class="glass"></p>
    </div>
    <div class="dock glass" aria-label="Controles do ambiente">
      <div id="channels" aria-label="Canais de som"></div>
      <div class="actions">
        <button id="breathe-button" class="cta" data-action="breath">Respirar 1 minuto</button>
        <button id="sound-button" class="icon-button" data-action="sound" aria-label="Ligar som" aria-pressed="false"></button>
      </div>
    </div>
  </div>
  <footer class="utility">
    <div><button class="quiet" data-action="help">Preciso de ajuda agora</button></div>
    <div><button class="quiet" data-action="mixer" aria-controls="mixer" aria-expanded="false">Volumes</button><button class="quiet" data-action="settings">Ajustes</button><button class="quiet hide-control" data-action="collapse">Recolher</button></div>
  </footer>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  <dialog class="glass" id="dialog" aria-labelledby="dialog-title"></dialog>
</main>
<script type="module">/*APP*/</script>
</body>
</html>
