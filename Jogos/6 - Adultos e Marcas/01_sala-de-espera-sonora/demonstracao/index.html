<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,height=720">
<script src="./media/gsap.min.js"></script>
<style>
@font-face{font-family:Fraunces;src:url(./media/fraunces.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Inter;src:url(./media/inter.woff2) format("woff2");font-weight:100 900}
:root{--ground:#201712;--ink:#fff1dd;--gold:#ebc690;--glass:#3e2d25}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--ground)}
#sala-video{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.fill{position:absolute;inset:0;width:100%;height:100%}
#take{object-fit:cover}
#veil{background:linear-gradient(90deg,#170f0bee 0%,#1c120db7 26%,#20171225 64%,#21171205 86%),linear-gradient(0deg,#1e130c9a,transparent 53%);pointer-events:none}
.scene-content{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px;padding:0 75px}
.scene-content strong,.label{font-family:Inter,system-ui,sans-serif;color:var(--gold);font-size:19px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.scene-content h1,.scene-content h2{font-family:Fraunces,Georgia,serif;font-weight:480;letter-spacing:-.061em;font-size:83px;line-height:.94;margin:0}
.scene-content p{font-size:24px;line-height:1.4;margin:0;max-width:33ch}
#frame{width:870px;aspect-ratio:16/9;right:49px;left:auto;top:116px;height:auto;border:1px solid #e2be9a85;border-radius:18px;box-shadow:0 18px 40px #120c096e}
#desktop-copy .scene-content{justify-content:flex-start;padding:178px 0 0 53px;width:332px}
#desktop-copy h2{font-size:51px}
#desktop-copy p{font-size:21px;max-width:21ch}
#mobile-bg{background:radial-gradient(ellipse at 62% 45%,#554031,var(--ground) 69%);}
#phone{width:269px;height:582px;inset:67px 213px auto auto;object-fit:cover;border:1px solid #f2d8b075;border-radius:22px;box-shadow:0 18px 40px #120c0985}
#outro .scene-content{padding-left:90px;width:650px}
#outro h2{font-size:70px}
#outro p{max-width:30ch}
</style>
<title>Sala de Espera Sonora — demonstração</title>
</head>
<body>
<div id="sala-video" data-composition-id="sala" data-start="0" data-duration="12" data-width="1280" data-height="720" data-fps="24">
  <video id="take" class="clip fill" src="./media/sala.mp4" data-start="0" data-duration="12" data-track-index="0" data-has-audio="true" playsinline></video>
  <div id="veil" class="clip fill" data-start="0" data-duration="8.2" data-track-index="1" aria-hidden="true"></div>
  <section id="intro" class="clip fill" data-start="0" data-duration="4" data-track-index="2">
    <div class="scene-content">
      <strong>Espaço Travessia Psicologia</strong>
      <h1>Antes de entrar,<br>chegue.</h1>
      <p>Explore a Sala de Espera Sonora.</p>
    </div>
  </section>
  <section id="desktop-copy" class="clip fill" data-start="4" data-duration="4.2" data-track-index="2">
    <div class="scene-content">
      <span class="label">Sons da sala</span>
      <h2>Monte a sua<br>paisagem.</h2>
      <p>Toque nos objetos e ajuste o volume.</p>
    </div>
  </section>
  <img id="frame" class="clip fill" src="./media/desktop.png" data-start="4" data-duration="4.2" data-track-index="3" alt="Controles da sala e cartão de respiração em desktop">
  <div id="mobile-bg" class="clip fill" data-start="8.2" data-duration="3.8" data-track-index="1" aria-hidden="true"></div>
  <section id="outro" class="clip fill" data-start="8.2" data-duration="3.8" data-track-index="2">
    <div class="scene-content">
      <span class="label">Uma pausa opcional</span>
      <h2>Respire com<br>a luz.</h2>
      <p>Siga quando quiser.</p>
    </div>
  </section>
  <img id="phone" class="clip fill" src="./media/mobile.png" data-start="8.2" data-duration="3.8" data-track-index="3" alt="Sala de Espera Sonora no celular">
</div>
<script>
window.__timelines=window.__timelines||{};
const timeline=gsap.timeline({paused:true});
timeline.fromTo('#take',{scale:1},{scale:1.055,duration:12,ease:'none'},0);
timeline.fromTo('#intro .scene-content>*',{opacity:0,y:17},{opacity:1,y:0,duration:.57,stagger:.10,ease:'power2.out'},0.13);
timeline.to('#intro .scene-content',{opacity:0,y:-9,duration:.27,ease:'power1.in'},3.65);
timeline.fromTo('#frame',{opacity:0,x:19},{opacity:1,x:0,duration:.46,ease:'power2.out'},4);
timeline.fromTo('#desktop-copy .scene-content>*',{opacity:0,y:12},{opacity:1,y:0,duration:.45,stagger:.09,ease:'power2.out'},4.09);
timeline.to('#frame',{opacity:0,duration:.26},7.92);
timeline.to('#desktop-copy',{opacity:0,duration:.24},7.94);
timeline.fromTo('#phone',{opacity:0,x:19},{opacity:1,x:0,duration:.50,ease:'power2.out'},8.2);
timeline.fromTo('#outro .scene-content>*',{opacity:0,y:13},{opacity:1,y:0,duration:.50,stagger:.09,ease:'power2.out'},8.25);
timeline.to('#phone',{y:-8,duration:3.12,ease:'sine.inOut'},8.71);
window.__timelines.sala=timeline;
</script>
</body>
</html>
