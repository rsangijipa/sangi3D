<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Flor Rosa · Macro 3D</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            --glass: #151619d9;
            --line: #ffffff26
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #222923;
            color: #fff;
            overflow: hidden
        }

        #stage {
            position: fixed;
            inset: 0;
            touch-action: none;
            outline: none
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none
        }

        .brand {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            pointer-events: none;
            text-shadow: 0 2px 12px #000;
            max-width: 75vw
        }

        .brand small {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .22em;
            color: #f9d5e9
        }

        .brand h1 {
            font: 400 clamp(25px, 5vw, 43px)/1.05 Georgia, serif;
            margin: 5px 0
        }

        .brand p {
            font-size: 12px;
            margin: 6px 0;
            color: #e9e5e5
        }

        .toolbar {
            position: fixed;
            bottom: max(14px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            align-items: center;
            background: var(--glass);
            border: 1px solid var(--line);
            padding: 6px;
            border-radius: 17px;
            max-width: calc(100% - 20px);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px #0005
        }

        .toolbar button {
            min-width: 56px;
            white-space: nowrap;
            display: grid;
            gap: 2px;
            place-items: center;
            font-size: 10px;
            padding: 6px 8px
        }

        .toolbar b {
            font-size: 20px;
            font-weight: 400;
            line-height: 1
        }

        button,
        select {
            background: #ffffff0c;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 10px;
            min-height: 44px;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer
        }

        button:hover,
        button[aria-pressed=true] {
            background: #b74a883d;
            border-color: #f5a6d25e
        }

        button:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid #ffb9df;
            outline-offset: 2px
        }

        select {
            background: #29272c
        }

        #settings {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: 90px;
            width: min(310px, calc(100% - 24px));
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
            max-height: calc(100dvh - 115px);
            overflow: auto;
            backdrop-filter: blur(18px)
        }

        #settings h2 {
            font-size: 17px;
            margin: 0 0 10px
        }

        #settings label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin: 9px 0
        }

        #settings input[type=range] {
            width: 48%;
            accent-color: #e798c2
        }

        #settings p {
            font-size: 12px;
            color: #d9d4da;
            line-height: 1.5
        }

        #settings button {
            width: 100%;
            text-align: left;
            border-color: var(--line);
            margin: 3px 0
        }

        #ref {
            position: fixed;
            right: 14px;
            top: 14px;
            width: min(34vw, 230px);
            border: 1px solid #fff8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 24px #0007;
            background: #181718
        }

        #ref img {
            display: block;
            width: 100%
        }

        #ref figcaption {
            font-size: 11px;
            padding: 7px
        }

        #ref {
            margin: 0
        }

        #restore {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: 12px;
            background: #17171cbb;
            border: 1px solid var(--line)
        }

        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 85vw;
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            line-height: 1.5
        }

        #note {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid var(--line);
            background: var(--glass);
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            max-width: 90vw;
            text-align: center
        }

        [hidden] {
            display: none !important
        }

        @media(max-width:480px) {
            .toolbar {
                gap: 2px;
                padding: 4px
            }

            .toolbar button {
                min-width: 46px;
                padding: 6px 5px;
                font-size: 9px
            }

            .brand p {
                display: none
            }

            #settings {
                bottom: 75px
            }

            #note {
                bottom: 75px
            }

            #ref {
                top: 80px
            }
        }

        @media(max-height:440px) {
            .brand p {
                display: none
            }

            .brand h1 {
                font-size: 23px
            }

            #settings {
                bottom: 73px;
                max-height: calc(100dvh - 85px)
            }

            #ref {
                width: 105px
            }
        }
    </style>
</head>

<body>
    <main id="stage" tabindex="0"
        aria-label="Cena tridimensional de uma flor rosa. Use setas para girar e mais ou menos para aproximar."></main>
    <header class="brand" id="brand"><small>Jardim · estudo botânico</small>
        <h1>Flor Rosa</h1>
        <p>Uma perspectiva macro, em três dimensões</p>
    </header>
    <nav class="toolbar" id="toolbar" aria-label="Ferramentas"><button id="home"
            title="Restaurar enquadramento"><b>⌂</b>Referência</button><button id="macro"
            title="Aproximar o centro"><b>⊕</b>Macro</button><button id="compare"
            aria-pressed="false"><b>▣</b>Foto</button><button id="hide"><b>◉</b>Contemplar</button><button id="options"
            aria-expanded="false"><b>☷</b>Ajustes</button></nav>
    <aside id="settings" hidden>
        <h2>Ajustes da cena</h2><label>Qualidade<select id="quality">
                <option value="auto">Automática</option>
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
                <option value="ultra">Ultra</option>
            </select></label><label>Profundidade de campo <input type="checkbox" id="dof" checked></label><label>Brisa
            <input type="range" id="wind" min="0" max="1" step=".01" value=".24"></label><label>Movimento reduzido
            <input type="checkbox" id="reduce"></label><label>Luz <input type="range" id="light" min=".4" max="1.6"
                step=".02" value="1"></label><label>Volume <input type="range" id="volume" min="0" max="1" step=".01"
                value=".35"></label><button id="audio" aria-pressed="false">Ativar som ambiente</button><button
            id="capture">Salvar captura PNG</button><button id="fullscreen">Alternar tela cheia</button>
        <p id="stats" aria-live="off">Inicializando…</p>
        <p>Arraste para orbitar. Pinça ou roda para zoom. Setas, +/− e Home também funcionam. Pressione Esc para voltar
            da contemplação.</p>
    </aside>
