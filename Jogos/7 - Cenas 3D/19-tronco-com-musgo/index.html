<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tronco com musgo</title>
<meta name="description" content="Aproxime-se do tronco de mata fechada e ajuste a luz para observar as camadas de musgo.">
<style>
html,body{margin:0;height:100%;background:#050a03;overflow:hidden;font:14px system-ui,sans-serif;color:#fff4df}
#stage canvas{display:block;touch-action:none}
button,select{font:inherit;color:#fff4df;background:#17200fcc;border:1px solid #ffd78a44;border-radius:22px;min-height:44px;padding:0 14px;cursor:pointer}
:focus-visible{outline:2px solid #ffd45e;outline-offset:2px}
#menu{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:48px;height:48px;padding:0;font-size:20px;z-index:3}
#panel{display:none;position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));width:min(280px,calc(100vw - 24px));max-height:70dvh;overflow:auto;box-sizing:border-box;padding:12px;background:#0d1408e6;border:1px solid #ffd78a33;border-radius:18px;gap:8px;grid-template-columns:1fr 1fr;z-index:3}
#panel.open{display:grid}#panel label,#panel p{grid-column:1/-1;margin:2px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
#panel p{font-size:12px;opacity:.75;display:block;line-height:1.45}input[type=range]{flex:1;accent-color:#ffb52e;min-height:44px}
[aria-pressed=false]{opacity:.55}
#show{z-index:3;display:none;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:48px;height:48px;padding:0}
.contemplar #panel,.contemplar #menu{display:none}.contemplar #show{display:block}
#err{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;background:#0b1006;z-index:9}
</style></head><body>
<main id="stage" aria-label="Cena 3D de um tronco coberto de musgo em mata fechada"></main>
<button id="menu" aria-label="Controles" aria-controls="panel" aria-expanded="false">☰</button>
<div id="panel">
<button id="reset">Vista da foto</button><button id="wind"></button>
<button id="dof" aria-pressed="true">Desfoque</button><button id="zen">Contemplar</button>
<button id="shot">Salvar PNG</button><select id="quality" aria-label="Qualidade"><option value="auto">Auto</option><option value="baixo">Baixo</option><option value="medio">Médio</option><option value="alto">Alto</option><option value="ultra">Ultra</option></select>
<label>Luz <input id="light" type="range" min="40" max="140" value="100"></label>
<p>Arraste para girar · pinça ou rolagem para zoom · dois dedos para deslocar.<br>Teclado: setas giram, R restaura, V vento, H oculta os controles.</p>
</div>
<button id="show" aria-label="Mostrar controles">☰</button>
<div id="err" role="alert">Não foi possível iniciar o WebGL. Abra em um navegador atualizado com aceleração gráfica.</div>
