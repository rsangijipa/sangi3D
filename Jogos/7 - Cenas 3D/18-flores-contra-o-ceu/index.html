function trumpet(parent,pts,r,mat,{lobes=true,rot=rr(0,6),seg=64}={}){

  let rad=r*(.13+.7*Math.pow(THREE.MathUtils.smoothstep(v,0,.75),.9)+.28*Math.pow(v,4));let along=0;
  if(lobes){const q=THREE.MathUtils.smoothstep(v,.76,1),lb=Math.pow(Math.abs(Math.cos((th+rot)*2.5)),.45);

   along=r*q*(.42*(lb-.65)+.07*Math.sin(th*11+rot*2))-r*.28*Math.pow(THREE.MathUtils.smoothstep(v,.9,1),2)*lb;}
  else rad*=1-THREE.MathUtils.smoothstep(v,.7,1)*.85;
  rad*=1+.075*Math.cos(th*5+rot+v*1.5)*v+.03*Math.cos(th*11)*v;
  return c.getPoint(v).addScaledVector(f.a,Math.cos(th)*rad).addScaledVector(f.b,Math.sin(th)*rad*.9).addScaledVector(f.T,along);},mat);
 parent.add(m);return m;}

const quadScene=new THREE.Scene();quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),blur));

const Q={baixo:{dpr:1,bg:.25,extra:false},médio:{dpr:1.35,bg:.35,extra:true},alto:{dpr:2,bg:.5,extra:true}};
const modes=['auto','baixo','médio','alto'];let mode=0,auto=matchMedia('(pointer:coarse)').matches?'baixo':'médio',cur;
function resize(){const w=innerWidth,h=innerHeight;cur=Q[modes[mode]==='auto'?auto:modes[mode]];
 renderer.setPixelRatio(Math.min(devicePixelRatio,cur.dpr));renderer.setSize(w,h);
 camera.aspect=w/h;
 // contém o quadro de referência inteiro, sem deformar
 const half=Math.max(H/200/D,W/200/D/camera.aspect)*(w/h<.8?1.02:1);
 camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(half));camera.updateProjectionMatrix();
 const v=renderer.getDrawingBufferSize(new THREE.Vector2()).multiplyScalar(cur.bg);
 rtA.setSize(Math.ceil(v.x),Math.ceil(v.y));rtB.setSize(Math.ceil(v.x),Math.ceil(v.y));
 bgExtra.forEach(g=>g.visible=cur.extra);}
function reset(){controls.enableDamping=false;controls.update();camera.position.set(0,0,D);controls.target.set(0,0,0);camera.zoom=1;controls.update();controls.enableDamping=true;}
addEventListener('resize',resize);resize();reset();

let wind=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const label=()=>{$('wind').textContent='Vento: '+(wind?'ligado':'desligado');$('wind').setAttribute('aria-pressed',wind)};label();
$('reset').onclick=reset;$('wind').onclick=()=>{wind=!wind;label()};
$('q').onclick=()=>{mode=(mode+1)%4;$('q').textContent='Qualidade: '+modes[mode];frames=0;acc=0;resize()};
$('view').onclick=()=>{const on=document.body.classList.toggle('clean');$('view').textContent=on?'Mostrar menu':'Contemplar';$('view').setAttribute('aria-pressed',on)};
addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='Escape'&&document.body.classList.contains('clean'))$('view').click();
  if(e.key.toLowerCase()==='r')reset();
 const a={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key];
 if(a){e.preventDefault();const s=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  s.theta=THREE.MathUtils.clamp(s.theta+a[0],-1.15,1.15);s.phi=THREE.MathUtils.clamp(s.phi+a[1],.65,2.45);
  camera.position.setFromSpherical(s).add(controls.target);}});
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('err').textContent='O contexto gráfico foi perdido. Recarregue a página.';$('err').style.display='block'});

let last=0,frames=0,acc=0,warm=0;
renderer.setAnimationLoop(now=>{const raw=last?(now-last)/1000:0,dt=Math.min(.05,raw);last=now;if(document.hidden)return;
 if(wind)time.value+=dt;controls.update();
 if(modes[mode]==='auto'&&raw<.5&&++warm>90){acc+=raw;frames++;
  if(acc>3){const fps=frames/acc,o=['baixo','médio','alto'];let i=o.indexOf(auto);
   if(fps<28&&i>0)i--;else if(fps>55&&i<2&&warm<900)i++;
   if(o[i]!==auto){auto=o[i];resize();}acc=0;frames=0;}}
 renderer.setRenderTarget(rtA);renderer.clear();renderer.render(bg,camera);
 blur.uniforms.map.value=rtA.texture;blur.uniforms.step.value.set(rtA.height*.0018/rtA.width,0);
 renderer.setRenderTarget(rtB);renderer.render(quadScene,quadCam);
 blur.uniforms.map.value=rtB.texture;blur.uniforms.step.value.set(0,.0018);
 renderer.setRenderTarget(rtA);renderer.render(quadScene,quadCam);
 blur.uniforms.map.value=rtA.texture;blur.uniforms.step.value.set(0,0);
 renderer.setRenderTarget(null);renderer.clear();renderer.render(quadScene,quadCam);
 renderer.clearDepth();renderer.render(fg,camera);
 window.ready=true;});
</script></body></html>
