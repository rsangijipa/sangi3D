<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ateliê dos Remendos e Transformações — Experiência 3D Interativa</title>
  
  <!-- Tailwind CSS & Three.js CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Barra Imersiva Compartilhada do Workspace -->
  <link rel="stylesheet" href="shared/imersivo.css?v=3" />

  <style>
    :root {
      --cor-madeira: #8c5a3c;
      --cor-verde-corte: #1b4332;
      --cor-rosa-remendo: #e27382;
      --cor-amarelo-mostarda: #e09f3e;
      --cor-azul-alfaiate: #3a86ff;
      --cor-creme: #fcf8f2;
      --cor-grafite: #2b2d42;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #171514;
      color: #ede8e1;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    #webgl-canvas.mode-cut {
      cursor: crosshair;
    }
    #webgl-canvas.mode-sew {
      cursor: cell;
    }

    /* Painéis translúcidos estilo Glassmorphism */
    .glass-box {
      background: rgba(26, 23, 22, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 214, 198, 0.18);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }
    .glass-warm {
      background: rgba(38, 30, 26, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(230, 160, 120, 0.28);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    /* Botões de ferramenta */
    .btn-tool {
      transition: all 220ms cubic-bezier(.2,.6,.3,1);
    }
    .btn-tool:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
    .btn-tool.active {
      background: linear-gradient(135deg, #e27382, #b8405e);
      color: #fff;
      border-color: #f7a8b4;
      box-shadow: 0 0 18px rgba(226, 115, 130, 0.55);
      transform: translateY(-2px);
    }

    /* Amostras de tecidos circulares */
    .swatch-circle {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: all 180ms ease;
      position: relative;
    }
    .swatch-circle:hover {
      transform: scale(1.12);
      border-color: #fff;
    }
    .swatch-circle.active {
      transform: scale(1.18);
      border-color: #e27382;
      box-shadow: 0 0 14px rgba(226, 115, 130, 0.8);
    }

    /* Animação suave para toasts e notificações */
    @keyframes toastFade {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.95); }
      15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      85% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -15px) scale(0.98); }
    }
    .toast-anim {
      animation: toastFade 3.2s cubic-bezier(.2,.8,.3,1) forwards;
    }

    /* Scrollbar personalizada discreta */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
    ::-webkit-scrollbar-thumb { background: rgba(220,180,150,0.3); border-radius: 9999px; }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden select-none">

  <!-- Canvas WebGL 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- UI Superior (Integrada à Barra Imersiva) -->
  <header id="ui-top-bar" class="absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none z-20">
    <div class="flex items-center space-x-3 pointer-events-auto">
      <a href="/index.html" class="glass-box px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/10 flex items-center space-x-2 text-amber-100/90 transition" title="Voltar ao Launcher">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Launcher</span>
      </a>
      <div class="glass-box px-4 py-2 rounded-xl flex flex-col">
        <span class="text-xs uppercase tracking-wider text-amber-300/80 font-bold">Ambiente 04 · Reconstrução Fiel</span>
        <h1 class="text-sm font-semibold text-white/95">Ateliê dos Remendos e Transformações</h1>
      </div>
    </div>

    <!-- Controles Rápidos do Topo -->
    <div class="flex items-center space-x-2 pointer-events-auto">
      <!-- Alternador de Luz da Luminária -->
      <button id="btn-lamp-toggle" class="glass-box px-3 py-2 rounded-xl text-xs font-medium hover:bg-white/10 flex items-center space-x-1.5 text-amber-200 transition" title="Ligar/Desligar Luminária de Mesa (L)">
        <span id="lamp-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
        <span id="lamp-text">Luz: Quente</span>
      </button>

      <!-- Botão da Máquina de Costura -->
      <button id="btn-machine-pedal" class="glass-box px-3 py-2 rounded-xl text-xs font-medium hover:bg-white/10 flex items-center space-x-1.5 text-pink-200 transition" title="Acionar Máquina de Costura (Espaço)">
        <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>
        <span id="machine-text">Costurar</span>
      </button>

      <!-- Botão de Áudio -->
      <button id="btn-audio-toggle" class="glass-box p-2.5 rounded-xl hover:bg-white/10 text-stone-200 transition" title="Som Ambiente e Efeitos Táteis (M)">
        <svg id="svg-sound-on" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="svg-sound-off" class="w-4 h-4 text-stone-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>

      <!-- Ponto de Vista da Câmera (Enquadramento Original da Imagem) -->
      <button id="btn-camera-reset" class="glass-box p-2.5 rounded-xl hover:bg-white/10 text-stone-200 transition" title="Retornar à Perspectiva da Foto de Referência (R)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

      <!-- Painel Lateral Recolhível -->
      <button id="btn-toggle-drawer" class="glass-box px-3.5 py-2 rounded-xl text-xs font-semibold hover:bg-white/10 text-white flex items-center space-x-1.5 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        <span>Ferramentas</span>
      </button>
    </div>
  </header>

  <!-- Barra Inferior de Interações Principais -->
  <nav id="ui-bottom-dock" class="absolute bottom-5 left-1/2 -translate-x-1/2 flex items-center space-x-3 pointer-events-auto z-20">
    <div class="glass-warm px-4 py-2.5 rounded-2xl flex items-center space-x-3 shadow-2xl border border-amber-200/20">
      
      <!-- Modo Mover / Selecionar -->
      <button id="tool-select" class="btn-tool active px-3.5 py-2 rounded-xl text-xs font-medium flex items-center space-x-1.5" title="Mover e Girar Retalhos">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
        <span>Mover</span>
      </button>

      <!-- Modo Cortar Novo Retalho -->
      <button id="tool-cut" class="btn-tool px-3.5 py-2 rounded-xl text-xs font-medium bg-stone-800/60 hover:bg-stone-700/60 text-stone-200 flex items-center space-x-1.5" title="Cortar Formas de Tecido (C)">
        <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879a3 3 0 11-4.242-4.242 3 3 0 014.242 0L12 12zm0 0L9.121 9.121a3 3 0 114.242-4.242 3 3 0 01-4.242 4.242L12 12z"/></svg>
        <span>Cortar</span>
      </button>

      <!-- Modo Costurar / Unir Peças -->
      <button id="tool-sew" class="btn-tool px-3.5 py-2 rounded-xl text-xs font-medium bg-stone-800/60 hover:bg-stone-700/60 text-stone-200 flex items-center space-x-1.5" title="Costurar e Criar Pontos (S)">
        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        <span>Costurar</span>
      </button>

      <!-- Modo Remendar Ursinho -->
      <button id="tool-mend" class="btn-tool px-3.5 py-2 rounded-xl text-xs font-medium bg-stone-800/60 hover:bg-stone-700/60 text-rose-200 flex items-center space-x-1.5" title="Aplicar Remendo Acolhedor no Ursinho">
        <svg class="w-4 h-4 text-pink-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Remendar</span>
      </button>

      <div class="h-5 w-px bg-white/20 my-auto"></div>

      <!-- Ações de Histórico -->
      <button id="btn-undo" class="p-2 rounded-xl text-stone-400 hover:text-white hover:bg-white/10 transition" title="Desfazer Última Ação (Ctrl+Z)">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2a5 5 0 01-5 5H6m-3-12l4-4m-4 4l4 4"/></svg>
      </button>
      <button id="btn-clear-scene" class="p-2 rounded-xl text-stone-400 hover:text-rose-400 hover:bg-white/10 transition" title="Limpar Retalhos Adicionados">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
      <button id="btn-save-shot" class="p-2 rounded-xl text-amber-300 hover:text-amber-100 hover:bg-white/10 transition" title="Exportar Foto da Sua Criação">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      </button>
    </div>
  </nav>

  <!-- Painel Lateral de Ferramentas e Criação (Drawer) -->
  <aside id="tool-drawer" class="fixed top-0 right-0 h-full w-84 max-w-[90vw] glass-box border-l border-white/15 p-5 flex flex-col z-30 transition-transform duration-300 translate-x-full overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-white/10">
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-rose-400"></span>
        <h2 class="text-sm font-bold text-white tracking-wide">Painel do Artesão</h2>
      </div>
      <button id="btn-close-drawer" class="p-1 rounded-lg text-stone-400 hover:text-white hover:bg-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Seção 1: Catálogo de Tecidos e Padrões -->
    <div class="mt-4">
      <label class="block text-xs uppercase tracking-wider text-amber-200/80 font-bold mb-2">1. Escolher Tecido</label>
      <div id="fabric-swatches" class="grid grid-cols-4 gap-2.5">
        <!-- Amostras preenchidas via script -->
      </div>
      <div id="fabric-name-display" class="mt-2 text-xs text-stone-300 italic">Floral Vintage Delicado</div>
    </div>

    <!-- Seção 2: Formas de Corte -->
    <div class="mt-5">
      <label class="block text-xs uppercase tracking-wider text-amber-200/80 font-bold mb-2">2. Forma de Corte</label>
      <div class="grid grid-cols-3 gap-2">
        <button data-shape="square" class="shape-btn active py-2 px-2.5 rounded-xl text-xs bg-white/10 hover:bg-white/20 text-center font-medium border border-rose-400 text-rose-200">Quadrado</button>
        <button data-shape="heart" class="shape-btn py-2 px-2.5 rounded-xl text-xs bg-white/5 hover:bg-white/20 text-center font-medium border border-transparent text-stone-300">Coração</button>
        <button data-shape="circle" class="shape-btn py-2 px-2.5 rounded-xl text-xs bg-white/5 hover:bg-white/20 text-center font-medium border border-transparent text-stone-300">Círculo</button>
        <button data-shape="triangle" class="shape-btn py-2 px-2.5 rounded-xl text-xs bg-white/5 hover:bg-white/20 text-center font-medium border border-transparent text-stone-300">Triângulo</button>
        <button data-shape="hexagon" class="shape-btn py-2 px-2.5 rounded-xl text-xs bg-white/5 hover:bg-white/20 text-center font-medium border border-transparent text-stone-300">Hexágono</button>
        <button data-shape="strip" class="shape-btn py-2 px-2.5 rounded-xl text-xs bg-white/5 hover:bg-white/20 text-center font-medium border border-transparent text-stone-300">Faixa</button>
      </div>
    </div>

    <!-- Seção 3: Escala / Tamanho -->
    <div class="mt-5">
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs uppercase tracking-wider text-amber-200/80 font-bold">3. Dimensão do Retalho</label>
        <span id="scale-value" class="text-xs text-stone-400">Médio (10cm)</span>
      </div>
      <input id="slider-scale" type="range" min="0.6" max="1.8" step="0.1" value="1.0" class="w-full accent-rose-400 bg-stone-700 h-1.5 rounded-lg appearance-none cursor-pointer" />
    </div>

    <!-- Botão de Ação: Cortar Agora -->
    <div class="mt-5">
      <button id="btn-spawn-patch" class="w-full py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white shadow-lg shadow-rose-900/40 flex items-center justify-center space-x-2 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879a3 3 0 11-4.242-4.242 3 3 0 014.242 0L12 12z"/></svg>
        <span>Cortar e Posicionar Retalho</span>
      </button>
    </div>

    <hr class="border-white/10 my-5" />

    <!-- Seção 4: Costura & Pontos -->
    <div>
      <label class="block text-xs uppercase tracking-wider text-amber-200/80 font-bold mb-2">4. Tipo de Ponto (Costura)</label>
      <div class="grid grid-cols-2 gap-2">
        <button data-stitch="running" class="stitch-btn active py-2 px-2 rounded-xl text-xs bg-white/10 border border-sky-400 text-sky-200 font-medium text-center">Pesponto Simples</button>
        <button data-stitch="zigzag" class="stitch-btn py-2 px-2 rounded-xl text-xs bg-white/5 border border-transparent text-stone-300 font-medium text-center">Zigue-Zague</button>
        <button data-stitch="blanket" class="stitch-btn py-2 px-2 rounded-xl text-xs bg-white/5 border border-transparent text-stone-300 font-medium text-center">Ponto Caseado</button>
        <button data-stitch="cross" class="stitch-btn py-2 px-2 rounded-xl text-xs bg-white/5 border border-transparent text-stone-300 font-medium text-center">Ponto Cruz</button>
      </div>

      <!-- Cores de Linha -->
      <label class="block text-xs uppercase tracking-wider text-amber-200/80 font-bold mt-3 mb-2">Cor da Linha</label>
      <div id="thread-colors" class="flex space-x-2">
        <button data-color="#fdf0d5" class="thread-swatch active w-7 h-7 rounded-full bg-[#fdf0d5] border-2 border-white shadow" title="Algodão Cru"></button>
        <button data-color="#e27382" class="thread-swatch w-7 h-7 rounded-full bg-[#e27382] border-2 border-transparent" title="Rosa Antigo"></button>
        <button data-color="#3a86ff" class="thread-swatch w-7 h-7 rounded-full bg-[#3a86ff] border-2 border-transparent" title="Azul Anil"></button>
        <button data-color="#e09f3e" class="thread-swatch w-7 h-7 rounded-full bg-[#e09f3e] border-2 border-transparent" title="Mostarda Ouro"></button>
        <button data-color="#2a9d8f" class="thread-swatch w-7 h-7 rounded-full bg-[#2a9d8f] border-2 border-transparent" title="Verde Eucalipto"></button>
        <button data-color="#ffffff" class="thread-swatch w-7 h-7 rounded-full bg-[#ffffff] border-2 border-transparent" title="Branco Puro"></button>
      </div>
    </div>

    <hr class="border-white/10 my-5" />

    <!-- Seção 5: Modos da Experiência (Seção 8 do Prompt) -->
    <div>
      <label class="block text-xs uppercase tracking-wider text-amber-200/80 font-bold mb-2">Modo de Experiência</label>
      <div class="space-y-2">
        <button id="mode-free" class="w-full text-left p-2.5 rounded-xl bg-white/10 border border-white/20 text-xs font-medium text-white hover:bg-white/15 transition">
          <div class="font-bold text-amber-300">Modo 1 · Exploração Livre</div>
          <div class="text-[11px] text-stone-300">Sem metas ou limites. Crie, combine e experimente no seu próprio tempo.</div>
        </button>
        <button id="mode-guided" class="w-full text-left p-2.5 rounded-xl bg-white/5 border border-transparent text-xs font-medium text-stone-300 hover:bg-white/10 transition">
          <div class="font-bold text-rose-300">Modo 2 · Proposta Poética</div>
          <div id="guided-prompt-text" class="text-[11px] text-stone-400 mt-0.5">"Que parte de você pede um remendo acolhedor hoje?"</div>
        </button>
        <button id="mode-mindful" class="w-full text-left p-2.5 rounded-xl bg-white/5 border border-transparent text-xs font-medium text-stone-300 hover:bg-white/10 transition">
          <div class="font-bold text-teal-300">Modo 3 · Presença e Cuidado</div>
          <div class="text-[11px] text-stone-400 mt-0.5">Respiração compassada no ritmo ritmado da agulha e da linha.</div>
        </button>
      </div>
    </div>

    <!-- Informações de Atalhos -->
    <div class="mt-auto pt-6 text-[11px] text-stone-400 border-t border-white/10 flex flex-col space-y-1">
      <div><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-stone-200 font-mono">Espaço</kbd> Costurar na máquina</div>
      <div><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-stone-200 font-mono">L</kbd> Alternar luz da mesa</div>
      <div><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-stone-200 font-mono">R</kbd> Restaurar enquadramento inicial</div>
      <div><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-stone-200 font-mono">H</kbd> Recolher interface imersiva</div>
    </div>
  </aside>

  <!-- Notificação / Toast Dinâmico -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <script>
    class AudioManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgGain = null;
        this.isReady = false;
      }

      init() {
        if (this.isReady) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.bgGain = this.ctx.createGain();
          this.bgGain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          this.bgGain.connect(this.ctx.destination);
          this.startStudioAmbience();
          this.isReady = true;
        } catch (e) {
          console.warn('Web Audio API não inicializada:', e);
        }
      }

      toggleMute() {
        if (!this.isReady) this.init();
        this.muted = !this.muted;
        if (this.bgGain && this.ctx) {
          this.bgGain.gain.setTargetAtTime(this.muted ? 0 : 0.08, this.ctx.currentTime, 0.1);
        }
        return this.muted;
      }

      // Som ambiente acolhedor de ateliê (tom ressonante harmônico 432Hz suave)
      startStudioAmbience() {
        if (!this.ctx) return;
        const baseFreqs = [216, 324, 432];
        baseFreqs.forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          // Modulador lento de respiração
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          lfo.frequency.setValueAtTime(0.12, this.ctx.currentTime);
          lfoGain.gain.setValueAtTime(0.02, this.ctx.currentTime);
          lfo.connect(lfoGain);
          lfoGain.connect(gain.gain);
          lfo.start();

          gain.gain.setValueAtTime(0.025, this.ctx.currentTime);
          osc.connect(gain);
          gain.connect(this.bgGain);
          osc.start();
        });
      }

      // Som de corte de tesoura em tecido (ruído rosa moldado com envelope rápido)
      playSnipSound() {
        if (this.muted || !this.ctx) return;
        const dur = 0.14;
        const bufferSize = this.ctx.sampleRate * dur;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2800, this.ctx.currentTime);
        filter.Q.setValueAtTime(2.2, this.ctx.currentTime);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      // Som mecânico e rítmico da máquina de costura eletrônica
      playSewingSound() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      // Ponto de agulha e linha atravessando o tecido (clique macio tátil)
      playStitchPop() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(680, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.04);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      // Toque suave no ursinho de pelúcia (chime amigável)
      playBearChime() {
        if (this.muted || !this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime + idx * 0.06;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.55);
        });
      }
    }

    const audio = new AudioManager();
    window.addEventListener('pointerdown', () => audio.init(), { once: true });
  </script>

  <!-- Script Principal da Cena 3D Three.js -->
  <script>
    // --- ESTADO GLOBAL DA APLICAÇÃO ---
    const State = {
      activeTool: 'select', // 'select', 'cut', 'sew', 'mend'
      currentFabric: 'floral',
      currentShape: 'square',
      patchScale: 1.0,
      stitchType: 'running',
      threadColor: '#fdf0d5',
      lampOn: true,
      lampMode: 'warm', // 'warm', 'neutral', 'dim'
      machineSewing: false,
      patches: [],
      selectedPatch: null,
      history: []
    };

    // --- CATÁLOGO DE PADRÕES PROCEDURAIS DE TECIDO ---
    const Fabrics = {
      floral: {
        name: 'Floral Vintage Delicado',
        color: '#f6ede2',
        accent: '#d85a6a',
        pattern: 'floral'
      },
      gingham: {
        name: 'Xadrez Vichy Lavanda',
        color: '#e4dcf1',
        accent: '#9a7aa0',
        pattern: 'gingham'
      },
      polka: {
        name: 'Poá Rosa Chá',
        color: '#f0c6cd',
        accent: '#ffffff',
        pattern: 'polka'
      },
      denim: {
        name: 'Jeans Índigo Macio',
        color: '#3d5a80',
        accent: '#98c1d9',
        pattern: 'denim'
      },
      mustard: {
        name: 'Algodão Mostarda Solar',
        color: '#e29532',
        accent: '#fff3b0',
        pattern: 'geo'
      },
      linen: {
        name: 'Linho Cru Artesanal',
        color: '#dfd7cc',
        accent: '#b8a99a',
        pattern: 'linen'
      },
      terracotta: {
        name: 'Terracota Rústico',
        color: '#b85d43',
        accent: '#e7a977',
        pattern: 'dots'
      },
      mint: {
        name: 'Menta Botânica',
        color: '#a8dadc',
        accent: '#457b9d',
        pattern: 'leaves'
      }
    };

    // --- GERADOR DE TEXTURAS PROCEDURAIS CANVAS ---
    function createProceduralTexture(type, baseColor, accentColor, size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, size, size);

      // Trama base de tecido têxtil sutil (subtle weave)
      ctx.fillStyle = 'rgba(0,0,0,0.035)';
      for (let x = 0; x < size; x += 4) {
        ctx.fillRect(x, 0, 1.5, size);
      }
      for (let y = 0; y < size; y += 4) {
        ctx.fillRect(0, y, size, 1.5);
      }

      if (type === 'floral') {
        ctx.fillStyle = accentColor;
        for (let i = 0; i < 40; i++) {
          const cx = (i * 97) % size;
          const cy = (i * 137) % size;
          ctx.beginPath();
          ctx.arc(cx, cy, 7, 0, Math.PI * 2);
          ctx.fill();
          // Pétalas
          for (let p = 0; p < 5; p++) {
            const angle = (p * Math.PI * 2) / 5;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(angle) * 9, cy + Math.sin(angle) * 9, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }
          // Miolo dourado
          ctx.fillStyle = '#fcefb4';
          ctx.beginPath();
          ctx.arc(cx, cy, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = accentColor;
        }
      } else if (type === 'gingham') {
        const step = size / 16;
        ctx.fillStyle = accentColor;
        ctx.globalAlpha = 0.45;
        for (let x = 0; x < size; x += step * 2) {
          ctx.fillRect(x, 0, step, size);
        }
        for (let y = 0; y < size; y += step * 2) {
          ctx.fillRect(0, y, size, step);
        }
        ctx.globalAlpha = 1.0;
      } else if (type === 'polka') {
        ctx.fillStyle = accentColor;
        const step = size / 12;
        for (let x = step / 2; x < size; x += step) {
          for (let y = step / 2; y < size; y += step) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (type === 'denim') {
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.35;
        for (let d = -size; d < size * 2; d += 6) {
          ctx.beginPath();
          ctx.moveTo(d, 0);
          ctx.lineTo(d + size, size);
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      } else if (type === 'linen') {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 2000; i++) {
          const rx = Math.random() * size;
          const ry = Math.random() * size;
          ctx.fillRect(rx, ry, Math.random() * 8 + 2, 1);
        }
      } else {
        // Padrão geométrico delicado
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        const step = size / 10;
        for (let x = 0; x < size; x += step) {
          for (let y = 0; y < size; y += step) {
            ctx.strokeRect(x + 4, y + 4, step - 8, step - 8);
          }
        }
        ctx.globalAlpha = 1.0;
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // Textura da Base de Corte Verde Milimetrada com régua e ângulos
    function createCuttingMatTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Fundo verde escuro autorregenerativo
      ctx.fillStyle = '#173f2f';
      ctx.fillRect(0, 0, 1024, 1024);

      // Grade milimétrica fina
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= 1024; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }
      for (let y = 0; y <= 1024; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1024, y);
        ctx.stroke();
      }

      // Linhas principais a cada 5cm (80px)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 2;
      for (let x = 0; x <= 1024; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }
      for (let y = 0; y <= 1024; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1024, y);
        ctx.stroke();
      }

      // Linhas de ângulo de corte 45° e 60°
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(1024, 1024);
      ctx.moveTo(0, 512);
      ctx.lineTo(512, 1024);
      ctx.moveTo(512, 0);
      ctx.lineTo(1024, 512);
      ctx.stroke();

      // Borda e escala numérica
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = 'bold 16px monospace';
      for (let i = 0; i <= 12; i++) {
        ctx.fillText(i.toString(), i * 80 + 4, 22);
        ctx.fillText(i.toString(), 6, i * 80 + 22);
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    // Textura da Madeira da Bancada
    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#9b6b47';
      ctx.fillRect(0, 0, 1024, 1024);

      // Veios da madeira
      ctx.strokeStyle = 'rgba(74, 46, 26, 0.35)';
      for (let y = 0; y < 1024; y += 8) {
        ctx.lineWidth = Math.random() * 3 + 1;
        ctx.beginPath();
        ctx.moveTo(0, y + (Math.random() - 0.5) * 6);
        for (let x = 0; x < 1024; x += 64) {
          ctx.lineTo(x, y + Math.sin(x * 0.01) * 8 + (Math.random() - 0.5) * 4);
        }
        ctx.stroke();
      }

      // Nós da madeira sutis
      for (let n = 0; n < 3; n++) {
        const nx = Math.random() * 800 + 100;
        const ny = Math.random() * 800 + 100;
        ctx.fillStyle = 'rgba(56, 32, 16, 0.4)';
        ctx.beginPath();
        ctx.ellipse(nx, ny, 28, 14, Math.PI / 8, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    // --- CONFIGURAÇÃO DA CENA THREE.JS ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1c1917');
    scene.fog = new THREE.FogExp2('#1c1917', 0.018);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    
    // Enquadramento fiel correspondente à imagem de referência
    const INITIAL_CAMERA_POS = new THREE.Vector3(1.2, 7.8, 10.5);
    const INITIAL_CAMERA_TARGET = new THREE.Vector3(0.8, 1.2, 0.2);
    camera.position.copy(INITIAL_CAMERA_POS);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(INITIAL_CAMERA_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.04; // Não atravessar o chão
    controls.minDistance = 3.5;
    controls.maxDistance = 22;

    // --- SISTEMA DE ILUMINAÇÃO CINEMATOGRÁFICA ---
    // Luz Ambiente Suave de Ateliê
    const ambientLight = new THREE.AmbientLight('#fff1e6', 0.65);
    scene.add(ambientLight);

    // Luz Solar da Janela (Directional Light vindo da direita superior)
    const windowSunLight = new THREE.DirectionalLight('#ffe9cc', 1.1);
    windowSunLight.position.set(12, 14, 8);
    windowSunLight.castShadow = true;
    windowSunLight.shadow.mapSize.width = 2048;
    windowSunLight.shadow.mapSize.height = 2048;
    windowSunLight.shadow.camera.near = 0.5;
    windowSunLight.shadow.camera.far = 35;
    windowSunLight.shadow.camera.left = -10;
    windowSunLight.shadow.camera.right = 10;
    windowSunLight.shadow.camera.top = 10;
    windowSunLight.shadow.camera.bottom = -10;
    windowSunLight.shadow.bias = -0.0004;
    scene.add(windowSunLight);

    // Luz de Preenchimento Suave (Rim Light azulado difuso do lado esquerdo)
    const fillLight = new THREE.DirectionalLight('#a2c4e0', 0.35);
    fillLight.position.set(-10, 6, -6);
    scene.add(fillLight);

    // Foco de Luz da Luminária Articulada de Mesa (SpotLight cônico direto)
    const deskLampSpot = new THREE.SpotLight('#ffe0aa', 2.6, 14, Math.PI / 4.2, 0.45, 1.2);
    deskLampSpot.position.set(3.8, 6.2, -0.6);
    deskLampSpot.castShadow = true;
    deskLampSpot.shadow.mapSize.width = 1024;
    deskLampSpot.shadow.mapSize.height = 1024;
    deskLampSpot.shadow.bias = -0.0003;
    const lampTarget = new THREE.Object3D();
    lampTarget.position.set(0.6, 0.2, 0.8);
    scene.add(lampTarget);
    deskLampSpot.target = lampTarget;
    scene.add(deskLampSpot);

    // Lâmpada incandescente visível emissiva na luminária
    const bulbGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const bulbMat = new THREE.MeshBasicMaterial({ color: '#fff5d6' });
    const bulbMesh = new THREE.Mesh(bulbGeo, bulbMat);
    bulbMesh.position.copy(deskLampSpot.position);
    scene.add(bulbMesh);

    // --- MATERIAIS COMPARTILHADOS ---
    const woodTex = createWoodTexture();
    const tableMat = new THREE.MeshStandardMaterial({
      map: woodTex,
      roughness: 0.65,
      metalness: 0.05
    });

    const cuttingMatTex = createCuttingMatTexture();
    const cuttingMatMaterial = new THREE.MeshStandardMaterial({
      map: cuttingMatTex,
      roughness: 0.45,
      metalness: 0.02
    });

    const machineWhiteMat = new THREE.MeshStandardMaterial({
      color: '#f8f8f6',
      roughness: 0.28,
      metalness: 0.08
    });

    const chromeMat = new THREE.MeshStandardMaterial({
      color: '#dcdcdc',
      roughness: 0.15,
      metalness: 0.92
    });

    const brassMat = new THREE.MeshStandardMaterial({
      color: '#d4af37',
      roughness: 0.35,
      metalness: 0.75
    });

    // --- CONSTRUÇÃO DO CENÁRIO ARQUITETÔNICO 3D ---
    const studioGroup = new THREE.Group();
    scene.add(studioGroup);

    // Chão do Ateliê
    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: '#2a221d', roughness: 0.85 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.2;
    floor.receiveShadow = true;
    studioGroup.add(floor);

    // Paredes do Fundo (Greige rústico acolhedor)
    const backWallGeo = new THREE.PlaneGeometry(30, 16);
    const wallMat = new THREE.MeshStandardMaterial({ color: '#7a7267', roughness: 0.95 });
    const backWall = new THREE.Mesh(backWallGeo, wallMat);
    backWall.position.set(0, 4.8, -7.5);
    backWall.receiveShadow = true;
    studioGroup.add(backWall);

    // Bancada de Madeira Principal
    const tableTopGeo = new THREE.BoxGeometry(16, 0.45, 9);
    const tableTop = new THREE.Mesh(tableTopGeo, tableMat);
    tableTop.position.set(0, 0, 0);
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    studioGroup.add(tableTop);

    // Pernas da Mesa
    const legGeo = new THREE.BoxGeometry(0.55, 3.2, 0.55);
    const legPositions = [
      [-7.4, -1.6, -4],
      [7.4, -1.6, -4],
      [-7.4, -1.6, 4],
      [7.4, -1.6, 4]
    ];
    legPositions.forEach(pos => {
      const leg = new THREE.Mesh(legGeo, tableMat);
      leg.position.set(...pos);
      leg.castShadow = true;
      studioGroup.add(leg);
    });

    // Base de Corte Verde Milimetrada na Mesa (Cutting Mat)
    const matGeo = new THREE.BoxGeometry(7.6, 0.03, 5.2);
    const matMesh = new THREE.Mesh(matGeo, cuttingMatMaterial);
    matMesh.position.set(1.5, 0.24, 1.2);
    matMesh.receiveShadow = true;
    studioGroup.add(matMesh);

    // --- COLCHA DE RETALHOS TRIDIMENSIONAL (PATCHWORK QUILT) ---
    // À esquerda na mesa, composta por retalhos quadrados acolchoados reais
    const quiltGroup = new THREE.Group();
    quiltGroup.position.set(-4.6, 0.24, 1.5);
    studioGroup.add(quiltGroup);

    const quiltFabricsKeys = Object.keys(Fabrics);
    const quiltRows = 4;
    const quiltCols = 4;
    const patchSize = 0.92;

    for (let r = 0; r < quiltRows; r++) {
      for (let c = 0; c < quiltCols; c++) {
        const fabKey = quiltFabricsKeys[(r * 3 + c) % quiltFabricsKeys.length];
        const fab = Fabrics[fabKey];
        const pTex = createProceduralTexture(fab.pattern, fab.color, fab.accent, 256);
        const pMat = new THREE.MeshStandardMaterial({
          map: pTex,
          roughness: 0.72,
          bumpScale: 0.015
        });

        // Bloco de retalho com almofadado sutil
        const patchGeo = new THREE.BoxGeometry(patchSize * 0.96, 0.04, patchSize * 0.96);
        const pMesh = new THREE.Mesh(patchGeo, pMat);
        pMesh.position.set((c - (quiltCols - 1) / 2) * patchSize, 0.02, (r - (quiltRows - 1) / 2) * patchSize);
        pMesh.castShadow = true;
        pMesh.receiveShadow = true;
        quiltGroup.add(pMesh);
      }
    }

    // --- MÁQUINA DE COSTURA ELETRÔNICA MODERNA (HERO OBJECT 3D) ---
    const sewingMachine = new THREE.Group();
    sewingMachine.position.set(0.8, 0.24, -1.8);
    studioGroup.add(sewingMachine);

    // Base da máquina
    const mBaseGeo = new THREE.BoxGeometry(4.2, 0.45, 1.8);
    const mBase = new THREE.Mesh(mBaseGeo, machineWhiteMat);
    mBase.position.set(0, 0.22, 0);
    mBase.castShadow = true;
    sewingMachine.add(mBase);

    // Chapa da agulha de metal (placa metálica com ranhuras)
    const plateGeo = new THREE.BoxGeometry(1.2, 0.04, 1.1);
    const plateMesh = new THREE.Mesh(plateGeo, chromeMat);
    plateMesh.position.set(-1.1, 0.46, 0);
    plateMesh.receiveShadow = true;
    sewingMachine.add(plateMesh);

    // Coluna vertical direita
    const colGeo = new THREE.BoxGeometry(1.2, 2.5, 1.4);
    const colMesh = new THREE.Mesh(colGeo, machineWhiteMat);
    colMesh.position.set(1.4, 1.5, 0);
    colMesh.castShadow = true;
    sewingMachine.add(colMesh);

    // Volante manual lateral (Handwheel)
    const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.22, 24);
    const wheelMesh = new THREE.Mesh(wheelGeo, chromeMat);
    wheelMesh.rotation.z = Math.PI / 2;
    wheelMesh.position.set(2.05, 2.2, 0);

    function spawnCustomPatch(fabricKey, shapeType, scale = 1.0, posX = null, posZ = null) {
      patchCounter++;
      const fab = Fabrics[fabricKey] || Fabrics.floral;
      const tex = createProceduralTexture(fab.pattern, fab.color, fab.accent, 256);
      
      let geo;
      const s = 0.9 * scale;

      if (shapeType === 'heart') {
        const hShape = new THREE.Shape();
        hShape.moveTo(0, 0.3 * s);
        hShape.bezierCurveTo(0, 0.5 * s, -0.4 * s, 0.6 * s, -0.4 * s, 0.3 * s);
        hShape.bezierCurveTo(-0.4 * s, 0.05 * s, -0.2 * s, -0.15 * s, 0, -0.4 * s);
        hShape.bezierCurveTo(0.2 * s, -0.15 * s, 0.4 * s, 0.05 * s, 0.4 * s, 0.3 * s);
        hShape.bezierCurveTo(0.4 * s, 0.6 * s, 0, 0.5 * s, 0, 0.3 * s);
        geo = new THREE.ShapeGeometry(hShape);
        geo.rotateX(-Math.PI / 2);
      } else if (shapeType === 'circle') {
        geo = new THREE.CylinderGeometry(0.45 * s, 0.45 * s, 0.02, 32);
      } else if (shapeType === 'triangle') {
        const tShape = new THREE.Shape();
        tShape.moveTo(0, 0.5 * s);
        tShape.lineTo(-0.45 * s, -0.4 * s);
        tShape.lineTo(0.45 * s, -0.4 * s);
        tShape.closePath();
        geo = new THREE.ShapeGeometry(tShape);
        geo.rotateX(-Math.PI / 2);
      } else if (shapeType === 'strip') {
        geo = new THREE.BoxGeometry(1.4 * s, 0.02, 0.35 * s);
      } else if (shapeType === 'hexagon') {
        geo = new THREE.CylinderGeometry(0.48 * s, 0.48 * s, 0.02, 6);
      } else {
        // Quadrado (Padrão)
        geo = new THREE.BoxGeometry(s, 0.025, s);
      }

      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.75,
        metalness: 0.02
      });

      const patchMesh = new THREE.Mesh(geo, mat);
      
      // Posiciona na base de corte ou nas coordenadas informadas
      const spawnX = posX !== null ? posX : (1.0 + (Math.random() - 0.5) * 2.5);

      patchMesh.receiveShadow = true;

        shapeType,
        scale,
        isPatch: true,
        stitches: []

      patchesGroup.add(patchMesh);
      State.patches.push(patchMesh);
      State.selectedPatch = patchMesh;

      audio.playSnipSound();
      showToast(`Novo retalho ${fab.name} cortado!`);
      return patchMesh;
    }

    // --- SISTEMA DE COSTURA TRIDIMENSIONAL COM PONTOS VISÍVEIS ---
    function sewPatch(patch) {
      if (!patch) return;
      audio.playStitchPop();

      // Adiciona linha de pesponto pontilhado ao longo do retalho
      const stitchGroup = new THREE.Group();
      const numStitches = 10;
      const radius = 0.38 * (patch.userData.scale || 1.0);
      const sMat = new THREE.MeshBasicMaterial({ color: State.threadColor });

      for (let i = 0; i < numStitches; i++) {
        const segGeo = new THREE.BoxGeometry(0.06, 0.015, 0.02);
        const seg = new THREE.Mesh(segGeo, sMat);
        const angle = (i / numStitches) * Math.PI * 2;
        seg.position.set(Math.cos(angle) * radius, 0.02, Math.sin(angle) * radius);
        seg.rotation.y = -angle;
        stitchGroup.add(seg);
      }

      patch.add(stitchGroup);
      patch.userData.stitches.push(stitchGroup);
      showToast(`Ponto ${State.stitchType} aplicado com sucesso!`);
    }

    // --- RAYCASTING E CONTROLE DE ARRASTAR (DRAG & DROP) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.27);
    const planeIntersect = new THREE.Vector3();

    let isDragging = false;
    let draggedObject = null;
    let dragOffset = new THREE.Vector3();

    window.addEventListener('pointerdown', (e) => {
      // Ignora cliques que atingem os painéis da interface HTML
      if (e.target.closest('#ui-top-bar, #ui-bottom-dock, #tool-drawer, .glass-box')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      // 1. Testa clique no ursinho de pelúcia
      const bearIntersects = raycaster.intersectObjects([bearBody, bearHead, heartMesh], true);
      if (bearIntersects.length > 0) {
        audio.playBearChime();
        // Animação fofa do ursinho (leve inclinação da cabeça)
        const startRot = bearHead.rotation.z;
        bearHead.rotation.z += 0.2;
        setTimeout(() => bearHead.rotation.z = startRot, 600);
        showToast('Ursinho acolhido! "Obrigado pelo carinho."');
        return;
      }

      // 2. Testa clique na máquina de costura
      const machineIntersects = raycaster.intersectObjects([mBase, colMesh, armMesh, headMesh], true);
      if (machineIntersects.length > 0) {
        toggleSewingMachine();
        return;
      }

      // 3. Testa clique na luminária de mesa
      const lampIntersects = raycaster.intersectObjects([lampBase, shadeMesh, arm1, arm2], true);
      if (lampIntersects.length > 0) {
        toggleDeskLamp();
        return;
      }

      // 4. Testa seleção e arrasto de retalhos
      const patchIntersects = raycaster.intersectObjects(State.patches, true);
      if (patchIntersects.length > 0) {
        // Encontra o objeto pai retalho
        let topObj = patchIntersects[0].object;
        while (topObj.parent && topObj.parent !== patchesGroup) {
          topObj = topObj.parent;
        }

        if (State.activeTool === 'sew') {
          sewPatch(topObj);
          return;
        }

        draggedObject = topObj;
        State.selectedPatch = topObj;
        isDragging = true;
        controls.enabled = false;

        // Eleva suavemente ao segurar
        draggedObject.position.y += 0.08;

        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
          dragOffset.copy(draggedObject.position).sub(planeIntersect);
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !draggedObject) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
        draggedObject.position.x = planeIntersect.x + dragOffset.x;
        draggedObject.position.z = planeIntersect.z + dragOffset.z;

        // Limites da bancada de madeira
        draggedObject.position.x = Math.max(-7.2, Math.min(7.2, draggedObject.position.x));
        draggedObject.position.z = Math.max(-3.8, Math.min(3.8, draggedObject.position.z));
      }
    });

    window.addEventListener('pointerup', () => {
      if (isDragging && draggedObject) {
        draggedObject.position.y -= 0.08;
        isDragging = false;
        draggedObject = null;
        controls.enabled = true;
      }
    });

    // --- FUNÇÕES DE CONTROLE DE EQUIPAMENTOS ---
    // Alternar funcionamento mecânico da máquina de costura
    function toggleSewingMachine() {
      State.machineSewing = !State.machineSewing;
      const textSpan = document.getElementById('machine-text');
      if (State.machineSewing) {
        textSpan.textContent = 'Parar';
        textSpan.parentElement.classList.add('bg-pink-600/40', 'border-pink-400');
        showToast('Máquina de costura em funcionamento...');
      } else {
        textSpan.textContent = 'Costurar';
        textSpan.parentElement.classList.remove('bg-pink-600/40', 'border-pink-400');
      }
    }

    // Alternar intensidade e tonalidade da Luminária Articulada
    function toggleDeskLamp() {
      if (State.lampMode === 'warm') {
        State.lampMode = 'neutral';
        deskLampSpot.color.set('#ffffff');
        deskLampSpot.intensity = 2.4;
        document.getElementById('lamp-text').textContent = 'Luz: Estúdio';
        document.getElementById('lamp-indicator').className = 'w-2.5 h-2.5 rounded-full bg-cyan-200 shadow-[0_0_8px_#a5f3fc]';
      } else if (State.lampMode === 'neutral') {
        State.lampMode = 'off';
        deskLampSpot.intensity = 0.0;
        bulbMesh.visible = false;
        document.getElementById('lamp-text').textContent = 'Luz: Desligada';
        document.getElementById('lamp-indicator').className = 'w-2.5 h-2.5 rounded-full bg-stone-600';
      } else {
        State.lampMode = 'warm';
        deskLampSpot.color.set('#ffe0aa');
        deskLampSpot.intensity = 2.6;
        bulbMesh.visible = true;
        document.getElementById('lamp-text').textContent = 'Luz: Quente';
        document.getElementById('lamp-indicator').className = 'w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]';
      }
      showToast(`Iluminação ajustada: ${document.getElementById('lamp-text').textContent}`);
    }

    // --- INTERFACE DE USUÁRIO & EVENTOS ---
    // Preenchimento das Amostras de Tecido no Drawer
    const swatchesContainer = document.getElementById('fabric-swatches');
    Object.entries(Fabrics).forEach(([key, fab], idx) => {
      const sw = document.createElement('div');
      sw.className = `swatch-circle ${idx === 0 ? 'active' : ''}`;
      sw.style.backgroundColor = fab.color;
      sw.style.borderColor = fab.accent;
      sw.title = fab.name;
      sw.addEventListener('click', () => {
        document.querySelectorAll('.swatch-circle').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        State.currentFabric = key;
        document.getElementById('fabric-name-display').textContent = fab.name;
      });
      swatchesContainer.appendChild(sw);
    });

    // Seletor de Formas de Corte
    document.querySelectorAll('.shape-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.shape-btn').forEach(b => {
          b.classList.remove('active', 'border-rose-400', 'text-rose-200', 'bg-white/10');
          b.classList.add('border-transparent', 'text-stone-300', 'bg-white/5');
        });
        btn.classList.add('active', 'border-rose-400', 'text-rose-200', 'bg-white/10');
        btn.classList.remove('border-transparent', 'text-stone-300', 'bg-white/5');
        State.currentShape = btn.dataset.shape;
      });
    });

    // Slider de Escala
    document.getElementById('slider-scale').addEventListener('input', (e) => {
      State.patchScale = parseFloat(e.target.value);
      const cm = Math.round(State.patchScale * 10);
      document.getElementById('scale-value').textContent = `${cm} cm`;
    });

    // Botão Cortar e Posicionar Retalho
    document.getElementById('btn-spawn-patch').addEventListener('click', () => {
      spawnCustomPatch(State.currentFabric, State.currentShape, State.patchScale);
    });

    // Seletor de Tipo de Ponto
    document.querySelectorAll('.stitch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stitch-btn').forEach(b => {
          b.classList.remove('active', 'border-sky-400', 'text-sky-200', 'bg-white/10');
          b.classList.add('border-transparent', 'text-stone-300', 'bg-white/5');
        });
        btn.classList.add('active', 'border-sky-400', 'text-sky-200', 'bg-white/10');
        btn.classList.remove('border-transparent', 'text-stone-300', 'bg-white/5');
        State.stitchType = btn.dataset.stitch;
      });
    });

    // Cores de Linha
    document.querySelectorAll('.thread-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.thread-swatch').forEach(b => b.classList.remove('border-white', 'shadow'));
        btn.classList.add('border-white', 'shadow');
        State.threadColor = btn.dataset.color;
      });
    });

    // Ferramentas da Barra Inferior
    function setActiveTool(tool) {
      State.activeTool = tool;
      document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tool-${tool}`);
      if (activeBtn) activeBtn.classList.add('active');

      canvas.classList.remove('mode-cut', 'mode-sew');
      if (tool === 'cut') canvas.classList.add('mode-cut');
      if (tool === 'sew') canvas.classList.add('mode-sew');
    }

    document.getElementById('tool-select').addEventListener('click', () => setActiveTool('select'));
    document.getElementById('tool-cut').addEventListener('click', () => {
      setActiveTool('cut');
      spawnCustomPatch(State.currentFabric, State.currentShape, State.patchScale);
    });
    document.getElementById('tool-sew').addEventListener('click', () => setActiveTool('sew'));
    document.getElementById('tool-mend').addEventListener('click', () => {
      setActiveTool('mend');
      // Corta um coração de amor e posiciona no ursinho
      const mPatch = spawnCustomPatch('terracotta', 'heart', 0.85, 5.7, 1.4);
      sewPatch(mPatch);
      audio.playBearChime();
      showToast('Um novo remendo acolhedor foi dedicado ao Ursinho!');
    });

    // Drawer Lateral
    const drawer = document.getElementById('tool-drawer');
    document.getElementById('btn-toggle-drawer').addEventListener('click', () => {
      drawer.classList.toggle('translate-x-full');
    });
    document.getElementById('btn-close-drawer').addEventListener('click', () => {
      drawer.classList.add('translate-x-full');
    });

    // Botões do Topo
    document.getElementById('btn-lamp-toggle').addEventListener('click', toggleDeskLamp);
    document.getElementById('btn-machine-pedal').addEventListener('click', toggleSewingMachine);
    document.getElementById('btn-audio-toggle').addEventListener('click', () => {
      const isMuted = audio.toggleMute();
      document.getElementById('svg-sound-on').classList.toggle('hidden', isMuted);
      document.getElementById('svg-sound-off').classList.toggle('hidden', !isMuted);
      showToast(isMuted ? 'Áudio em silêncio' : 'Áudio ativado');
    });
    document.getElementById('btn-camera-reset').addEventListener('click', () => {
      controls.reset();
      camera.position.copy(INITIAL_CAMERA_POS);
      controls.target.copy(INITIAL_CAMERA_TARGET);
      showToast('Perspectiva inicial restaurada');
    });

    // Ações de Histórico
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (State.patches.length > 0) {
        const last = State.patches.pop();
        patchesGroup.remove(last);
        showToast('Último retalho removido');
      }
    });

    document.getElementById('btn-clear-scene').addEventListener('click', () => {
      if (confirm('Deseja retirar todos os retalhos soltos da mesa?')) {
        State.patches.forEach(p => patchesGroup.remove(p));
        State.patches = [];
        showToast('Bancada organizada');
      }
    });

    document.getElementById('btn-save-shot').addEventListener('click', () => {
      renderer.render(scene, camera);
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = 'atelie-dos-remendos-criacao.png';
      link.href = dataUrl;
      link.click();
      showToast('Fotografia da sua criação exportada!');
    });

    // Modos Poéticos e Meditativos (Seção 8)
    const guidedPrompts = [
      '"Que parte de você pede um remendo acolhedor hoje?"',
      '"Qual cor traz a sensação de abrigo que você procura?"',
      '"Como seria unir dois pedaços que pareciam não combinar?"',
      '"Sem pressa: cada ponto dado é um momento que você se dedica."'
    ];
    let promptIdx = 0;
    document.getElementById('mode-guided').addEventListener('click', () => {
      promptIdx = (promptIdx + 1) % guidedPrompts.length;
      document.getElementById('guided-prompt-text').textContent = guidedPrompts[promptIdx];
      showToast(guidedPrompts[promptIdx]);
    });

    // Toasts visuais no topo
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'glass-warm px-4 py-2 rounded-xl text-xs font-semibold text-amber-100 shadow-2xl border border-amber-200/25 toast-anim my-1';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 3400);
    }

    // Atalhos de Teclado
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleSewingMachine();
      } else if (e.code === 'KeyL') {
        toggleDeskLamp();
      } else if (e.code === 'KeyM') {
        audio.toggleMute();
      } else if (e.code === 'KeyR') {
        document.getElementById('btn-camera-reset').click();
      } else if (e.code === 'KeyC') {
        document.getElementById('tool-cut').click();
      } else if (e.code === 'KeyS') {
        document.getElementById('tool-sew').click();
      } else if (e.code === 'KeyH') {
        // Recolhe/mostra controles imersivos
        const dock = document.getElementById('ui-bottom-dock');
        const header = document.getElementById('ui-top-bar');
        const hidden = dock.style.display === 'none';
        dock.style.display = hidden ? 'flex' : 'none';
        header.style.display = hidden ? 'flex' : 'none';
        drawer.classList.add('translate-x-full');
      } else if (e.code === 'Escape') {
        drawer.classList.add('translate-x-full');
      }
    });

    // Redimensionamento de Janela Responsivo
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- LOOP DE ANIMAÇÃO 3D (60 FPS) ---
    const clock = new THREE.Clock();
    let sewingTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Animação mecânica da Máquina de Costura quando ativada
      if (State.machineSewing) {
        needleBar.position.y = 1.35 + Math.sin(time * 35) * 0.16;
        wheelMesh.rotation.x += delta * 25;
        
        sewingTimer += delta;
        if (sewingTimer > 0.08) {
          audio.playSewingSound();
          sewingTimer = 0;
        }
      } else {
        needleBar.position.y = 1.35;
      }

      // Respiração orgânica sutil do Ursinho de Pelúcia (micro movimento)
      bearBody.scale.y = 1.15 + Math.sin(time * 1.8) * 0.012;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>

  <!-- Integração com a Barra Imersiva Compartilhada do Workspace -->
  <script src="shared/imersivo.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.Imersivo) {
        Imersivo.init({
          title: 'Ateliê dos Remendos',
          subtitle: 'Composição têxtil, reparo e presença',
          theme: 'dark',
          actions: ['#btn-lamp-toggle', '#btn-machine-pedal', '#btn-audio-toggle', '#btn-camera-reset'],
          bottom: ['#ui-bottom-dock'],
          panels: [
            { label: 'Ferramentas', icon: 'sliders', selector: '#tool-drawer', side: 'right', width: 340 }
          ]
        });
      }
    });
  </script>
</body>
</html>
