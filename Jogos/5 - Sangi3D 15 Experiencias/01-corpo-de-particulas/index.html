<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../engine.css">
<title>Corpo de Partículas · Sangi3D</title>
<link rel="stylesheet" href="../launcher-view.css">
</head>
<body style="--accent:#8ee9ee">
<main class="shell">
  <nav class="bar" aria-label="Navegação"><a href="../index.html">← Experiências</a><a href="mockup.html">Mockup do recurso</a></nav>
  <h1>Corpo de Partículas</h1>
  <div class="layout">
    <section aria-label="Visualização">
      <div class="viewport">
        <canvas id="view" aria-label="Cena 3D de Corpo de Partículas" tabindex="0"></canvas>
        <div class="crosshair" hidden></div><div class="scene-message" id="scene-message" role="status">Carregando a cena. Abra este jogo pelo servidor local.</div>
      </div>
      <div class="global" role="group" aria-label="Ajustes da experiência">
        <button id="pause" aria-pressed="false">Pausar</button><button id="sound" aria-pressed="false">Ativar som</button><button id="photo">Fotografar</button><button id="reset">Reiniciar cena</button>
        <select id="quality" aria-label="Qualidade gráfica"><option value="LOW">Econômica</option><option value="BALANCED" selected>Equilibrada</option><option value="HIGH">Alta</option></select>
        <button id="motion">Movimento reduzido</button>
      </div>
    </section>
    <section class="panel" aria-label="Ferramentas">
      <h2>Controles</h2>
      <p class="instructions">Disperse a silhueta com movimentos e desenhe trilhas de partículas.</p>
      <p class="hint" id="hint"></p>
      <div id="controls" class="rack"></div>
      <p id="status" class="status" role="status">Modo livre.</p>
      <small id="backend"></small>
    </section>
  </div>
</main>
<script src="../launcher-view.js" defer></script>
<script src="../../../Sistema/shared/sangi-bridge.js" defer></script>
<script type="module">import { mount } from '../runtime.js'; mount('01');</script>
</body>
</html>
