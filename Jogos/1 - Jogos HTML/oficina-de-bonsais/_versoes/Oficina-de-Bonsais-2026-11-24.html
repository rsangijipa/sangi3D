let raf,last=0,acc=0,frames=0,elapsed=0,slow=0,stopped=false;renderer.shadowMap.autoUpdate=false;function loop(t){if(stopped)return;raf=requestAnimationFrame(loop);if(document.hidden){last=t;return}let dt=Math.min(.05,(t-last)/1000||0);last=t;acc+=dt;while(acc>=config.step){updateSimulation(config.step);acc-=config.step}controls.update();renderer.render(scene,camera);frames++;elapsed+=dt;if(elapsed>3){if(quality==='Equilibrado'&&frames/elapsed<27){slow++;if(slow>=2&&renderer.getPixelRatio()>.85){renderer.setPixelRatio(.85);resize()}}else slow=0;frames=0;elapsed=0}}function cameraView(){let mobile=innerWidth/innerHeight<.8;controls.target.set(0,mobile?(viewClose?1.83:1.65):(viewClose?2.07:1.95),0);camera.position.copy(controls.target).add(new THREE.Vector3(viewClose?1.45:2.8,viewClose?.55:1.05,viewClose?2.6:5.1).multiplyScalar(mobile?1.22:1));controls.update()}
